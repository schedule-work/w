<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DNS > Card-Portal</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'media',
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales/ko.global.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/date-holidays/dist/umd.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* 기본 (라이트모드) 캘린더 스타일 */
        .fc {
            --fc-border-color: #e2e8f0;
            --fc-today-bg-color: #f1f5f9;
            background: white;
            padding: 10px;
            border-radius: 12px;
        }

        .fc .fc-toolbar-title {
            font-size: 1.25rem !important;
            font-weight: 600;
            color: #1e293b;
        }

        .fc .fc-button-primary {
            background-color: #1e40af !important;
            border-color: #1e40af !important;
            padding: 0.5rem 1rem;
        }

        .fc-event {
            cursor: pointer;
            padding: 2px 5px;
            font-size: 0.75rem;
            border-radius: 4px;
        }

        .fc-day-sun a {
            color: #ef4444 !important;
            text-decoration: none;
        }

        .fc-day-sat a {
            color: #3b82f6 !important;
            text-decoration: none;
        }

        .holiday-text {
            color: #ef4444;
            font-size: 0.7rem;
            font-weight: 500;
            margin-top: 2px;
        }

        .holiday-day a {
            color: #ef4444 !important;
        }

        .fc-highlight {
            background-color: rgba(59, 130, 246, 0.15) !important;
            box-shadow: inset 0 0 0 2px #3b82f6 !important;
        }

        /* 모바일 최적화 */
        @media (max-width: 640px) {
            .fc .fc-toolbar-title {
                font-size: 0.9rem !important;
            }

            .fc .fc-button {
                padding: 0.2rem 0.4rem !important;
                font-size: 0.7rem !important;
            }

            .fc-header-toolbar {
                flex-wrap: wrap;
                gap: 5px;
            }
        }

        /* 다크모드 캘린더 전용 스타일 */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #0f172a;
            }

            .fc {
                background: #1e293b;
                --fc-border-color: #334155;
                --fc-today-bg-color: #0f172a;
                --fc-page-bg-color: #1e293b;
                --fc-neutral-text-color: #cbd5e1;
                --fc-list-event-hover-bg-color: #334155;
                color: #f8fafc;
            }

            .fc .fc-toolbar-title {
                color: #f1f5f9 !important;
            }

            .fc-theme-standard td,
            .fc-theme-standard th {
                border-color: #334155;
            }

            .fc-col-header-cell-cushion,
            .fc-daygrid-day-number {
                color: #e2e8f0 !important;
            }

            .fc-scrollgrid {
                border-color: #334155 !important;
            }

            .fc-day-sun a,
            .holiday-day a {
                color: #f87171 !important;
            }

            .fc-day-sat a {
                color: #60a5fa !important;
            }

            .holiday-text {
                color: #f87171;
            }
        }
    </style>

    <link rel="icon" href="tiger_sunglasses.png" type="image/png">
    <link rel="apple-touch-icon" href="tiger_sunglasses.png">
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwp5HHDFNuWuwkgfEh0HHmexwwHfaakqUWTe4Z89MrxyIwiXf5QQLoxLwe_096-NRr2zw/exec";

        let hd = null;
        try {
            const Holiday =
                window.Holidays ||
                window.holidays ||
                window.Holiday ||
                window.DateHolidays;
            if (Holiday) {
                hd = new Holiday('KR');
                hd.setLanguages(['ko']);
            }
        } catch (e) {
            console.warn("date-holidays 로드 지연됨. 예비 데이터로 작동합니다.");
        }

        const FALLBACK_HOLIDAYS = {
            "2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴", "2026-03-01": "삼일절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날", "2026-05-25": "대체공휴일", "2026-06-03": "지방선거", "2026-06-06": "현충일", "2026-08-15": "광복절", "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴", "2026-10-03": "개천절", "2026-10-09": "한글날", "2026-12-25": "기독탄신일",
            "2027-01-01": "신정", "2027-02-06": "설날 연휴", "2027-02-07": "설날", "2027-02-08": "설날 연휴", "2027-02-09": "대체공휴일", "2027-03-01": "삼일절", "2027-05-05": "어린이날", "2027-05-13": "부처님오신날", "2027-06-06": "현충일", "2027-08-15": "광복절", "2027-09-14": "추석 연휴", "2027-09-15": "추석", "2027-09-16": "추석 연휴", "2027-10-03": "개천절", "2027-10-09": "한글날", "2027-12-25": "기독탄신일"
        };

        const DEPARTMENTS = [
            "응급전용병동", "51병동", "52병동", "53병동", "60병동", "61병동", "62병동", "63병동", "65병동", "70병동",
            "71병동", "72병동", "73병동", "80병동", "81병동", "82병동", "83병동", "85병동", "90병동", "91병동",
            "92병동", "93병동", "95병동", "100병동", "101병동", "분만실", "내시경실", "심혈관센터", "암병원", "응급실",
            "인공신장실", "1신경계중환자실", "2신경계중환자실", "내과중환자실", "마취통증의학과", "수술실", "신생아중환자실",
            "심혈관계중환자실", "외과중환자실", "응급중환자실", "중앙공급실", "보호요원실", "간호교육기획팀"
        ];

        const TIME_OPTIONS = [
            "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30",
            "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00",
            "15:30", "16:00", "16:30", "17:00", "17:30"
        ];

        function App() {
            const [user, setUser] = React.useState(() => { const saved = sessionStorage.getItem('cardPortalUser'); if (!saved) return null; try { const parsed = JSON.parse(saved); return parsed?.token ? parsed : null; } catch (e) { return null; } });
            const [loginInput, setLoginInput] = React.useState({ name: '', empNo: '' });
            const [events, setEvents] = React.useState([]);
            const [customHolidays, setCustomHolidays] = React.useState({});
            const customHolidaysRef = React.useRef(customHolidays);
            React.useEffect(() => {
                customHolidaysRef.current = customHolidays;
            }, [customHolidays]);
            const getHolidayName = (dateObj) => {
                const dateStr = [
                    dateObj.getFullYear(),
                    String(dateObj.getMonth() + 1).padStart(2, '0'),
                    String(dateObj.getDate()).padStart(2, '0')
                ].join('-');

            if (customHolidaysRef.current && customHolidaysRef.current[dateStr]) {
                return customHolidaysRef.current[dateStr];
            }

            if (dateObj.getMonth() === 6 && dateObj.getDate() === 17) return "제헌절";
            if (hd) {
                const res = hd.isHoliday(dateObj);
                if (res && Array.isArray(res)) {
                    const publicH = res.find(h => h.type === 'public' || h.type === 'bank');
                    if (publicH) return publicH.name;
                }
            }
            return FALLBACK_HOLIDAYS[dateStr] || null;
        };
            
            const [loading, setLoading] = React.useState(false);

            const [showListModal, setShowListModal] = React.useState(false);
            const [selectedDateReservations, setSelectedDateReservations] = React.useState([]);

            const calendarContainerRef = React.useRef(null);
            const calendarInstanceRef = React.useRef(null);
            const lastSelectedRef = React.useRef(null);
            const eventsRef = React.useRef(events);

            const [showNotice, setShowNotice] = React.useState(false);
            const [showForm, setShowForm] = React.useState(false);

            const [showInstruction, setShowInstruction] = React.useState(() => {
                const savedUser = sessionStorage.getItem('cardPortalUser');
                if (savedUser) {
                    const parsedUser = JSON.parse(savedUser);
                    return !parsedUser.isAdmin; 
                }
                return false;
            });
            
            const [selectedEvent, setSelectedEvent] = React.useState(null);
            const [selectedSlot, setSelectedSlot] = React.useState(null);

            const [deptSelect, setDeptSelect] = React.useState('선택');
            const [deptCustom, setDeptCustom] = React.useState('');
            const [budgetSelect, setBudgetSelect] = React.useState('선택');
            const [budgetCustom, setBudgetCustom] = React.useState('');
            const [phone1Select, setPhone1Select] = React.useState('010');
            const [phone1Custom, setPhone1Custom] = React.useState('');
            const [phone2, setPhone2] = React.useState('');
            const [phone3, setPhone3] = React.useState('');

            const [formData, setFormData] = React.useState({
                id: '', name: '', empNo: '', startDate: '', startTimePart: '', endDate: '', endTimePart: '', purpose: '', details: ''
            });

            // 내 예약 Modal
            const [showMyBookings, setShowMyBookings] = React.useState(false);
            
            // 예산 필터
            const [budgetFilter, setBudgetFilter] = React.useState('전체');
            
            // Toast
            const [toast, setToast] = React.useState(null);
            
            // 현재 시간 - 카드 사용 상태를 자동 갱신하기 위해 사용
            const [currentTime, setCurrentTime] = React.useState(new Date());
            
            React.useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentTime(new Date());
                }, 60000);
            
                return () => clearInterval(timer);
            }, []);
            
            
            // ============================================================
            // ⭐ Toast 표시 함수
            // ============================================================
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
            
                setTimeout(() => {
                    setToast(null);
                }, 2500);
            };
            
            
            // ============================================================
            // ⭐ 로그인 사용자의 향후 예약
            // ============================================================
            const myBookings = React.useMemo(() => events.filter(ev => ev.extendedProps?.isMine === true && new Date(ev.end) >= currentTime).sort((a, b) => new Date(a.start) - new Date(b.start)), [events, currentTime]);


            // ============================================================
            // ⭐ 현재 사용 중인 예약
            // ============================================================
            const currentBooking = React.useMemo(() => {
                const now = currentTime.getTime();
            
                return events.find(ev => {
                    const start = new Date(ev.start).getTime();
                    const end = new Date(ev.end).getTime();
            
                    return start <= now && now < end;
                }) || null;
            
            }, [events, currentTime]);
            
            
            // ============================================================
            // ⭐ 앞으로 가장 가까운 예약
            // ============================================================
            const nextBooking = React.useMemo(() => {
                const now = currentTime.getTime();
            
                return events
                    .filter(ev =>
                        new Date(ev.start).getTime() > now
                    )
                    .sort((a, b) =>
                        new Date(a.start) - new Date(b.start)
                    )[0] || null;
            
            }, [events, currentTime]);
            
            
            // ============================================================
            // ⭐ 표시용 날짜 / 시간 함수
            // ============================================================
            const formatShortDate = (dateValue) => {
                const d = new Date(dateValue);
            
                return `${d.getMonth() + 1}/${d.getDate()}`;
            };
            
            const formatClock = (dateValue) => {
                const d = new Date(dateValue);
            
                return `${String(d.getHours()).padStart(2, '0')}:${String(
                    d.getMinutes()
                ).padStart(2, '0')}`;
            };
                        
            const callApi = async (payload) => { const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }); const data = await response.json(); if (!data.success) { if (data.code === 'UNAUTHORIZED') { sessionStorage.removeItem('cardPortalUser'); setUser(null); } throw new Error(data.message || '요청 처리 중 오류가 발생했습니다.'); } return data; };

            const openBookingById = async (id, startObj, endObj) => {
                setLoading(true);
                try {
                    const data = await callApi({ action: 'GET_DETAIL', token: user.token, id }); const props = data.booking; setSelectedEvent(props);
                    if (DEPARTMENTS.includes(props.dept)) { setDeptSelect(props.dept); setDeptCustom(''); } else { setDeptSelect('직접 입력'); setDeptCustom(props.dept || ''); }
                    if (['간호부', 'QI(적정진료관리팀)', '총무팀'].includes(props.budget)) { setBudgetSelect(props.budget); setBudgetCustom(''); } else { setBudgetSelect('기타'); setBudgetCustom(props.budget || ''); }
                    if (props.contact) { const p = String(props.contact).replace(/^'/, '').trim().split('-'); if (['010', '011', '016'].includes(p[0])) { setPhone1Select(p[0] || '010'); setPhone1Custom(''); } else { setPhone1Select('기타'); setPhone1Custom(p[0] || ''); } setPhone2(p[1] || ''); setPhone3(p[2] || ''); } else { setPhone1Select('010'); setPhone1Custom(''); setPhone2(''); setPhone3(''); }
                    const toDateStr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'), toTimeStr = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
                    setFormData({ id: props.id, name: props.name || '', empNo: props.empNo || props.empNoMasked || '비공개', startDate: toDateStr(startObj), startTimePart: toTimeStr(startObj), endDate: toDateStr(endObj), endTimePart: toTimeStr(endObj), purpose: props.purpose || '', details: props.details || '' });
                    setSelectedSlot({ startDate: toDateStr(startObj), endDate: toDateStr(endObj) }); setShowListModal(false); setShowMyBookings(false); setShowForm(true);
                } catch (e) { alert(e.message); } finally { setLoading(false); }
            };

            const startRangeStr = "2026-05-01";
            const maxDate = new Date(2026, 4, 1);
            maxDate.setMonth(maxDate.getMonth() + 2);
            const maxDateStr = [maxDate.getFullYear(), String(maxDate.getMonth() + 1).padStart(2, '0'), String(maxDate.getDate()).padStart(2, '0')].join('-');

            React.useEffect(() => {
                eventsRef.current = events;
            }, [events]);

            const fetchBookings = async (isSilent = false) => {
                const silent = isSilent === true; if (!user?.token) return; if (!silent) setLoading(true);
                try { const data = await callApi({ action: 'LIST', token: user.token }); setEvents(data.bookings.map(b => { const budgetColor = b.budget === '간호부' ? '#3b82f6' : b.budget === '총무팀' ? '#10b981' : b.budget === 'QI(적정진료관리팀)' ? '#f59e0b' : '#64748b'; return { id: b.id, title: `[${b.dept}] ${b.name}`, start: b.startTime, end: b.endTime, extendedProps: { ...b, colorCode: budgetColor }, backgroundColor: 'transparent', borderColor: 'transparent' }; })); const holidayMap = {}; (data.holidays || []).forEach(row => holidayMap[row[0]] = row[1]); setCustomHolidays(holidayMap); }
                catch (e) { console.error(e); if (!silent) alert(e.message); } finally { if (!silent) setLoading(false); }
            };

            const handleLogin = async (e) => {
                e.preventDefault(); const trimmedName = loginInput.name.trim(), empNo = loginInput.empNo.trim().toUpperCase(); if (!trimmedName || !empNo) return alert('이름과 사번을 정확히 입력해주세요.'); setLoading(true);
                try { const data = await callApi({ action: 'LOGIN', name: trimmedName, empNo }); const loggedInUser = { ...data.user, token: data.token }; setUser(loggedInUser); sessionStorage.setItem('cardPortalUser', JSON.stringify(loggedInUser)); if (!loggedInUser.isAdmin) setShowInstruction(true); }
                catch (e) { alert(e.message); } finally { setLoading(false); }
            };

            const handleAdminAuth = async () => { const pin = window.prompt('관리자 PIN을 입력해주세요.'); if (pin === null) return; const cleanPin = String(pin).trim().toLowerCase(); if (!cleanPin) return alert('관리자 PIN을 입력해주세요.'); setLoading(true); try { const data = await callApi({ action: 'ADMIN_AUTH', token: user.token, pin: cleanPin }); const upgradedUser = { ...user, ...data.user, token: user.token }; setUser(upgradedUser); sessionStorage.setItem('cardPortalUser', JSON.stringify(upgradedUser)); showToast('관리자 인증이 완료되었습니다.'); await fetchBookings(true); } catch (e) { alert(e.message); } finally { setLoading(false); } };
            React.useEffect(() => { if (user) fetchBookings(); }, [user]);

            React.useEffect(() => {
                if (!user) return;
                if (!calendarContainerRef.current) return;
                if (calendarInstanceRef.current) return;

                    const calendar = new FullCalendar.Calendar(calendarContainerRef.current, {
                        height: '100%',
                        locale: 'ko',
                        selectable: true,
                        selectLongPressDelay: 0,
                        touchLongPressDelay: 0,
                        allDaySlot: false,
                        slotMinTime: '08:30:00',
                        slotMaxTime: '17:30:00',
                        validRange: { start: '2026-05-01' },

                        headerToolbar: {
                            left: 'prev,next today',
                            center: 'title',
                            right: 'dayGridMonth,timeGridDay'
                        },

                        dayCellClassNames: function (arg) {
                            if (getHolidayName(arg.date)) return ['holiday-day'];
                            return [];
                        },

                        dayCellContent: function (arg) {
                            const dayNumber = arg.dayNumberText.replace('일', '');
                            const holidayName = getHolidayName(arg.date);
                            if (holidayName && arg.view.type === 'dayGridMonth') {
                                return { html: `<div class="flex flex-col items-center"><span>${dayNumber}</span><span class="holiday-text">${holidayName}</span></div>` };
                            }
                            return { html: `<span>${dayNumber}</span>` };
                        },

                        eventContent: function (arg) {
                            const start = new Date(arg.event.start);
                            const end = new Date(arg.event.end);
                            const getFormat = (d) => {
                                let h = d.getHours();
                                let m = d.getMinutes();
                                const ampm = h < 12 ? 'A' : 'P';
                                if (h > 12) h -= 12;
                                if (h === 0) h = 12;
                                const mStr = m === 0 ? '' : m;
                                return `${h}${ampm}${mStr}`;
                            };
                            const timeStr = `${getFormat(start)}~${getFormat(end)}`;
                            const dept = arg.event.title.split(']')[0] + ']';
                            const evColor = arg.event.extendedProps.colorCode || '#64748b';
                            return { 
                                html: `<div style="border-left: 4px solid ${evColor}; background-color: ${evColor}1A; padding: 2px 6px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.75rem; color: var(--fc-neutral-text-color, #333);">
                                    <b style="color: ${evColor};">${timeStr}</b> ${dept}
                                </div>` 
                            };
                        },

                        unselect: function () {
                        },

                        select: function (info) {
                            const calendar = info.view.calendar;
                            const currentSelectedStr = info.startStr;

                            // 1. 첫 번째 클릭: 날짜 선택 (파란 테두리 표시)
                            if (lastSelectedRef.current !== currentSelectedStr) {
                                lastSelectedRef.current = currentSelectedStr;
                                return;
                            }

                            // 2. 두 번째 클릭: 동작 수행 (팝업 또는 폼 열기)
                            lastSelectedRef.current = null; // 초기화

                            // 유효성 검사 (과거/미래 날짜)
                            const today = new Date(); today.setHours(0, 0, 0, 0);
                            const maxSelectDate = new Date(); maxSelectDate.setMonth(maxSelectDate.getMonth() + 2);
                            const selectStart = new Date(info.startStr + "T00:00:00");

                            if (!user.isAdmin) {
                                if (selectStart < today) {
                                    alert("⚠️ 지난 날짜는 예약할 수 없습니다.");
                                    calendarInstanceRef.current.unselect()
                                    lastSelectedRef.current = null;
                                    return;
                                }
                                if (selectStart > maxSelectDate) {
                                    alert("⚠️ 예약은 2개월 이내의 날짜만 신청 가능합니다.");
                                    calendarInstanceRef.current.unselect()
                                    lastSelectedRef.current = null;
                                    return;
                                }
                            }

                            if (!isAvailableDate(info.startStr.split('T')[0])) {
                                alert("⚠️ 주말 및 공휴일은 예약할 수 없습니다.");
                                calendarInstanceRef.current.unselect();
                                lastSelectedRef.current = null;
                                return;
                            }

                            lastSelectedRef.current = null;

                                        {hasPermission ? (<><div className="flex items-center space-x-2"><select value={phone1Select} onChange={e => setPhone1Select(e.target.value)} className="w-24 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-blue-600 dark:focus:border-blue-500"><option value="010">010</option><option value="011">011</option><option value="016">016</option><option value="기타">직접 입력</option></select><span className="text-slate-400 dark:text-slate-500">-</span><input type="text" required maxLength="4" value={phone2} onChange={e => setPhone2(e.target.value.replace(/[^0-9]/g, ''))} className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm text-center focus:outline-none focus:border-blue-600" /><span className="text-slate-400 dark:text-slate-500">-</span><input type="text" required maxLength="4" value={phone3} onChange={e => setPhone3(e.target.value.replace(/[^0-9]/g, ''))} className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm text-center focus:outline-none focus:border-blue-600" /></div>{phone1Select === '기타' && <input type="text" required maxLength="4" value={phone1Custom} onChange={e => setPhone1Custom(e.target.value.replace(/[^0-9]/g, ''))} className="w-24 mt-2 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm text-center" placeholder="번호 입력" />}</>) : (<div className="rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 p-3"><div className="flex items-center justify-between gap-3"><div><div className="text-sm font-semibold text-slate-700 dark:text-slate-200">{selectedEvent?.contactRevealed ? selectedEvent.contact : selectedEvent?.contactMasked || '연락처 비공개'}</div>{!selectedEvent?.contactRevealed && <div className="text-[11px] text-slate-400 mt-1">필요한 경우에만 연락처를 확인해 주세요.</div>}</div>{!selectedEvent?.contactRevealed && <button type="button" onClick={async () => { setLoading(true); try { const data = await callApi({ action: 'GET_CONTACT', token: user.token, id: selectedEvent.id }); setSelectedEvent(prev => ({ ...prev, contact: data.contact, contactRevealed: true })); showToast('연락처가 표시되었습니다.'); } catch (e) { alert(e.message); } finally { setLoading(false); } }} className="shrink-0 px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold transition">연락처 보기</button>}</div></div>)}
                                    </div>

                                    <div className="flex flex-wrap gap-2 pt-4 border-t border-slate-100 dark:border-slate-700 mt-4">
    {formData.id && hasPermission && (
        <button type="button" onClick={handleDelete} className="flex-1 sm:flex-none whitespace-nowrap bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 font-medium px-3 py-2.5 rounded-xl text-xs sm:text-sm transition">
            예약 취소
        </button>
    )}
    <div className="flex-1 flex gap-2 justify-end w-full sm:w-auto">

        {user.isAdmin && (
            <button
                type="button"
                onClick={async () => {
                    const isHoliday = !!customHolidays[selectedSlot.startDate];
                    const name = isHoliday ? "" : "임시공휴일";
                    setLoading(true);
                    try {
                        await callApi({ action: "TOGGLE_HOLIDAY", token: user.token, date: selectedSlot.startDate, name });

                        setTimeout(async () => {
                            await fetchBookings();
                            calendarInstanceRef.current?.render();
                            setLoading(false);
                            alert(isHoliday ? "공휴일이 해제되었습니다." : "공휴일로 지정되었습니다.");
                        }, 1500);

                        setShowForm(false);
                    } catch (e) {
                        alert("오류가 발생했습니다.");
                        setLoading(false);
                    }
                }}
                className={`flex-1 sm:flex-none whitespace-nowrap px-3 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${!!customHolidays[selectedSlot.startDate]
                        ? "bg-amber-600 hover:bg-amber-700 text-white"
                        : "bg-purple-600 hover:bg-purple-700 text-white"
                    }`}
            >
                {customHolidays[selectedSlot.startDate] ? "공휴일 해제" : "공휴일 지정"}
            </button>
        )}
        
        <button type="button" onClick={() => {
            setShowForm(false);
            calendarInstanceRef.current?.unselect();
        }} className="flex-1 sm:flex-none whitespace-nowrap px-3 py-2.5 rounded-xl text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            취소
        </button>
        
        {hasPermission && (
            <button
                type="submit"
                disabled={loading}
                className={`flex-1 sm:flex-none whitespace-nowrap px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${loading ? 'bg-gray-400 dark:bg-slate-600 cursor-not-allowed text-white' : 'bg-blue-700 text-white hover:bg-blue-800 dark:hover:bg-blue-600'}`}
            >
                {loading ? '저장 중...' : '저장'}
            </button>
        )}
    </div>
</div>
                                </form>
                            </div>
                        </div>
                    )}
                    {showInstruction && (
                        <div 
                            className="fixed inset-0 bg-black/40 dark:bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[9999]" onClick={() => setShowInstruction(false)}>
                            <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full shadow-2xl p-6 border border-slate-100 dark:border-slate-700" onClick={(e) => e.stopPropagation()}>
                                <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4">법인카드 예약 시스템 이용 안내</h3>
                                <div className="bg-slate-50 dark:bg-slate-900 rounded-xl p-4 text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-6 space-y-4 max-h-[60vh] overflow-y-auto">
                                    <div>
                                        <p className="font-bold text-blue-600 dark:text-blue-400 mb-1">[예약 및 이용]</p>
                                        <p className="pl-2">• 캘린더 해당 날짜의 빈 공간 클릭하여 예약 신청</p>
                                        <p className="pl-2">• 기존 예약과 미중복 시 추가 예약 가능</p>
                                        <p className="pl-2">• 대여 및 반납: 평일 08:30 ~ 17:30</p>
                                    </div>
                                    
                                    <div>
                                        <p className="font-bold text-red-600 dark:text-red-400 mb-1">[예약 제한]</p>
                                        <p className="pl-2">• 예약 가능 기한: 신청일 기준 2개월 이내</p>
                                        <p className="pl-2">• 주말 및 공휴일 예약 불가</p>
                                        <p className="pl-2">• 최대 대여: 평일 기준 3일 (장기 대여 사전 문의)</p>
                                    </div>

                                    <div>
                                        <p className="font-bold text-emerald-600 dark:text-emerald-400 mb-1">[수정 및 취소]</p>
                                        <p className="pl-2">• 본인 예약 내역 클릭 시 수정 가능</p>
                                        <p className="pl-2">• 본인 예약 건에 한하여 취소 가능</p>
                                    </div>
                                </div>

                                <button onClick={() => setShowInstruction(false)} className="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-3 rounded-xl transition text-sm shadow-md">
                                    안내사항을 확인했습니다
                                </button>
                            </div>
                        </div>
                    
                    )}

                    {toast && (<div className="fixed bottom-20 sm:bottom-6 right-4 sm:right-6 z-[99999]">
                    
                            <div className={`flex items-center gap-2 px-4 py-3 rounded-xl shadow-xl border text-sm font-semibold ${ toast.type === 'error'
                                        ? 'bg-red-600 border-red-500 text-white'
                                        : toast.type === 'warning'
                                        ? 'bg-amber-500 border-amber-400 text-white'
                                        : 'bg-slate-900 dark:bg-white border-slate-800 dark:border-white text-white dark:text-slate-900'
                                }`}
                            >
                                <span>
                                    {toast.type === 'error'
                                        ? '✕'
                                        : toast.type === 'warning'
                                        ? '!'
                                        : '✓'
                                    }
                                </span>
                    
                                {toast.message}
                            </div>
                    
                        </div>
                    )}

                    <div className="sm:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-800/95 backdrop-blur border-t border-slate-200 dark:border-slate-700 px-3 py-2">
                    
                        <div className="grid grid-cols-3 gap-1">
                    
                            {/* 달력 */}
                            <button
                                onClick={() => {
                                    if (!calendarInstanceRef.current) return;
                    
                                    calendarInstanceRef.current.changeView(
                                        'dayGridMonth'
                                    );
                                }}
                                className="flex flex-col items-center justify-center gap-1 py-1 text-slate-500 dark:text-slate-300"
                            >
                                <svg
                                    className="w-5 h-5"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    strokeWidth="2"
                                >
                                    <rect x="3" y="4" width="18" height="17" rx="2"/>
                                    <path d="M8 2v4M16 2v4M3 10h18"/>
                                </svg>
                    
                                <span className="text-[10px] font-medium">
                                    달력
                                </span>
                            </button>
                    
                    
                            {/* 오늘 */}
                            <button
                                onClick={() => {
                                    if (!calendarInstanceRef.current) return;
                    
                                    calendarInstanceRef.current.today();
                                    calendarInstanceRef.current.changeView(
                                        'timeGridDay'
                                    );
                                }}
                                className="flex flex-col items-center justify-center gap-1 py-1 text-blue-600 dark:text-blue-400"
                            >
                                <div className="w-5 h-5 rounded-md bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center text-[10px] font-bold">
                                    {currentTime.getDate()}
                                </div>
                    
                                <span className="text-[10px] font-semibold">
                                    오늘
                                </span>
                            </button>
                    
                    
                            {/* 내 예약 */}
                            <button
                                onClick={() => setShowMyBookings(true)}
                                className="relative flex flex-col items-center justify-center gap-1 py-1 text-slate-500 dark:text-slate-300"
                            >
                                <svg
                                    className="w-5 h-5"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    strokeWidth="2"
                                >
                                    <path d="M8 7V3m8 4V3"/>
                                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                                    <path d="M3 11h18"/>
                                </svg>
                    
                                {myBookings.length > 0 && (
                                    <span className="absolute top-0 right-[28%] min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[9px] flex items-center justify-center">
                                        {myBookings.length}
                                    </span>
                                )}
                    
                                <span className="text-[10px] font-medium">
                                    내 예약
                                </span>
                            </button>
                    
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
