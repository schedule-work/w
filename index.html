<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DNS > 임상지원 근무표</title>
    <link rel="icon" type="image/png" href="IMG_385.png?v=2">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper-bg: #fdfcf7;
            --ink-black: #111111;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--paper-bg);
            color: var(--ink-black);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .font-editorial {
            font-family: 'Playfair Display', serif;
        }

        .border-editorial {
            border-color: var(--ink-black);
        }

        .main-tab {
            transition: all 0.2s ease;
            position: relative;
        }
        .main-tab[data-active="true"] {
            background-color: var(--ink-black);
            color: var(--paper-bg);
        }
        .main-tab[data-active="false"]:hover {
            background-color: #f0eee1;
        }

        .sub-menu-container {
            display: flex;
            overflow-x: auto;
            align-items: center;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .sub-menu-container::-webkit-scrollbar {
            display: none;
        }

        .sub-btn {
            white-space: nowrap;
            position: relative;
            padding: 0.25rem 0;
            transition: color 0.2s;
        }
        .sub-btn[data-active="true"] {
            font-weight: 600;
        }
        .sub-btn[data-active="true"]::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: var(--ink-black);
        }

        .marquee-container {
            background-color: var(--ink-black);
            color: var(--paper-bg);
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 30s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ── 검색 ── */
        #search-input {
            background-color: #fff;
        }
        #search-input:focus {
            outline: none;
            border-color: var(--ink-black);
        }
        .search-item:hover {
            background-color: #f5f4ee;
        }

        /* ── 직접 렌더링 표 ── */
        #sheet-container {
            position: absolute;
            inset: 0;
            overflow: auto;
            padding: 18px;
        }
        table.sheet-table {
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
            line-height: 1.35;
            table-layout: fixed;
        }
        table.sheet-table td {
            border: 1px solid #e5e3da;
            padding: 5px 9px;
            white-space: pre-line;
            text-align: center;
            vertical-align: middle;
            background-color: #fff;
            overflow: hidden;
        }
        .sheet-block-wrap {
            margin-bottom: 32px;
        }
        .sheet-block-wrap:last-child {
            margin-bottom: 0;
        }
        tr.row-highlight td {
            box-shadow: inset 0 0 0 2px #d63b1f;
        }
    </style>
</head>
<body>

    <header class="border-b border-editorial flex flex-col sm:flex-row justify-between items-center sm:items-end px-6 py-4 shrink-0">
        <div class="text-center sm:text-left mb-2 sm:mb-0">
            <h1 class="font-editorial text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight uppercase leading-none">
                Shift Schedule
            </h1>
            <p class="text-[10px] sm:text-xs tracking-[0.2em] uppercase mt-2 text-gray-600 font-medium">
                Korea University Guro Hospital • Department of Nursing Service
            </p>
        </div>
        <div class="text-center sm:text-right flex flex-col justify-end">
            <p class="text-[10px] font-medium tracking-widest uppercase border-b border-editorial pb-1 mb-1">
                임상지원간호팀
            </p>
            <p class="text-[10px] text-gray-500 tracking-wider">
                VOL. 2026
            </p>
        </div>
    </header>

    <nav class="border-b border-editorial flex flex-col md:flex-row shrink-0 bg-white">
        <div class="flex border-b md:border-b-0 md:border-r border-editorial shrink-0">
            <button id="btn-group1" class="main-tab px-6 py-3 text-sm font-semibold tracking-wider" onclick="toggleGroup('group1', this)">
                진료지원
            </button>
            <button id="btn-group2" class="main-tab px-6 py-3 text-sm font-semibold tracking-wider border-l border-editorial" onclick="toggleGroup('group2', this)">
                전담간호사
            </button>
        </div>

        <div class="flex-1 flex items-center px-6 py-2 overflow-hidden bg-[#faf9f5]">
            <div id="group1-sub" class="sub-menu-container gap-6 hidden w-full"></div>
            <div id="group2-sub" class="sub-menu-container gap-6 hidden w-full"></div>
        </div>
    </nav>

    <div id="search-bar" class="border-b border-editorial px-6 py-2.5 flex items-center gap-3 bg-white shrink-0 relative">
        <input id="search-input" type="text" placeholder="이름 또는 사번으로 전체 시트 검색" autocomplete="off"
               class="w-full max-w-xs text-sm border border-editorial px-3 py-1.5 rounded-none">
        <span id="search-status" class="text-[10px] text-gray-400 tracking-widest uppercase whitespace-nowrap"></span>

        <div id="search-dropdown" class="hidden absolute left-6 top-full mt-1 w-96 max-w-[90vw] max-h-96 overflow-y-auto bg-white border border-editorial shadow-lg z-30"></div>
    </div>

    <main class="flex-1 w-full relative z-0 bg-white">
        <div id="loading-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-20 hidden">
            <div class="font-editorial text-2xl italic tracking-widest animate-pulse border-b border-editorial pb-2">
                Loading Data...
            </div>
        </div>

        <div id="sheet-container"></div>
    </main>

    <footer class="marquee-container py-1.5 shrink-0 text-[10px] tracking-[0.2em] uppercase font-light">
        <div class="marquee-content">
            <span class="mx-6">KOREA UNIVERSITY GURO HOSPITAL</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">KUMC</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">Department of Nursing Service</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">Shift Schedule</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">KOREA UNIVERSITY GURO HOSPITAL</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">KUMC</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">Department of Nursing Service</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">Shift Schedule</span>
            <span class="mx-6 text-gray-500">|</span>
        </div>
    </footer>

    <script>
        // ══════════════════════════ CONFIG ══════════════════════════
        const sheetGroups = {
            group1: {
                name: "진료지원",
                api: "https://script.google.com/macros/s/AKfycbz_FRqb7fbZwxNg_eWIXjDL15tW8iZGllcs7y6-qzZev7YtFHgRNJUSgm9n7352AZXJYw/exec"
            },
            group2: {
                name: "전담간호사",
                api: "https://script.google.com/macros/s/AKfycbzBpLXtYgjmbzRp74KMrdb2_tZTJYkAQn_aMRQ2AQau3IoofRKA42tzEKpOGn4Hhftmew/exec"
            }
        };

        // 헤더(날짜행)+이름/사번열까지 고정(sticky)시킬 시트
        function isStickyTarget(group, sheetName) {
            if (group === 'group2') {
                return ['채혈전담', '중증외상최종치료센터', '통합항암 전담'].includes(sheetName);
            }
            if (group === 'group1') {
                return sheetName.indexOf('진료지원') === 0;
            }
            return false;
        }

        // ══════════════════════════ STATE / CACHE ══════════════════════════
        const sheetDataCache = new Map();   // "group:gid" -> payload
        const groupIndexCache = new Map();  // group -> Promise<record[]>
        let currentRenderedKey = null;

        // ══════════════════════════ API 계층 ══════════════════════════
        // fetch가 원인 불명으로 오래 멈춰있는 상황(응답이 아주 늦거나 안 옴)을 방지하기 위한 타임아웃 래퍼
        async function fetchJson(url, timeoutMs = 20000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function fetchSingleSheet(group, gid) {
            const key = `${group}:${gid}`;
            if (sheetDataCache.has(key)) return sheetDataCache.get(key);
            const payload = await fetchJson(`${sheetGroups[group].api}?sheet=${gid}`);
            sheetDataCache.set(key, payload);
            return payload;
        }

        function ensureGroupIndexed(group) {
            if (groupIndexCache.has(group)) return groupIndexCache.get(group);
            const promise = fetchJson(`${sheetGroups[group].api}?all=1`)
                .then(list => {
                    const records = [];
                    list.forEach(payload => {
                        sheetDataCache.set(`${group}:${payload.gid}`, payload);
                        const structure = analyzeSheetStructure(payload.values);
                        if (!structure) return; // 표 형식이 아닌 시트(공지문 등)는 검색 대상에서 제외
                        const seen = new Set();
                        structure.blocks.forEach(block => {
                            for (let r = block.headerRowIndex + block.headerRowCount; r < block.end; r++) {
                                const row = payload.values[r];
                                if (!row) continue;
                                const name = String(row[block.nameCol] || '').trim();
                                if (!name) continue;
                                const empId = block.idCol !== -1 ? String(row[block.idCol] || '').trim() : '';
                                // 사번이 없는 시트(예: 통합항암 전담)에서 동명이인을 구분하기 위해,
                                // 블록 안에서 헤더 바로 다음부터 몇 번째 줄인지(seat)도 같이 기록한다.
                                const seat = r - (block.headerRowIndex + block.headerRowCount);
                                const dedupeKey = empId ? (name + '|' + empId) : (name + '|seat' + seat);
                                if (seen.has(dedupeKey)) continue;
                                seen.add(dedupeKey);
                                records.push({
                                    group,
                                    groupName: sheetGroups[group].name,
                                    gid: payload.gid,
                                    sheetName: payload.name,
                                    name,
                                    empId,
                                    seat
                                });
                            }
                        });
                    });

                    // 사번이 없는데 같은 시트에 이름이 겹치는 경우(동명이인 가능성) 표시용 카운트 부여
                    const nameCounts = new Map();
                    records.forEach(r => {
                        if (r.empId) return;
                        const k = `${r.group}:${r.gid}:${r.name}`;
                        nameCounts.set(k, (nameCounts.get(k) || 0) + 1);
                    });
                    records.forEach(r => {
                        if (r.empId) return;
                        r.duplicateCount = nameCounts.get(`${r.group}:${r.gid}:${r.name}`) || 1;
                    });

                    return records;
                })
                .catch(err => {
                    console.error(err);
                    return [];
                });
            groupIndexCache.set(group, promise);
            return promise;
        }

        // ══════════════════════════ 구조 분석(파싱) ══════════════════════════
        const TITLE_RE = /\d{4}\s*년\s*\d{1,2}\s*월/;
        const HEADER_MARK = ['사번', '근무자'];

        function looksLikeWeekdayRow(row) {
            const cells = row.slice(1).map(v => String(v || '').trim()).filter(Boolean);
            if (!cells.length) return false;
            return cells.every(v => /^\(.+\)$/.test(v));
        }

        // "YYYY년 M월" 제목이 2번 이상 나오면 그 위치로 블록을 나눈다.
        // 그런 제목이 없거나 한 번뿐이어도(예: "OO센터 8월 근무표"처럼 연도 없는 제목), 헤더 마커(사번/근무자)가
        // 시트 안에서 2번 이상 나오면 그 자체를 블록 경계로 쓴다.
        function findBlockRanges(values) {
            const titleStarts = [];
            values.forEach((row, r) => {
                if (TITLE_RE.test(String(row[0] || '').trim())) titleStarts.push(r);
            });
            if (titleStarts.length >= 2) {
                return {
                    ranges: titleStarts.map((s, i) => ({ start: s, end: i + 1 < titleStarts.length ? titleStarts[i + 1] : values.length })),
                    isMultiBlock: true
                };
            }

            const headerStarts = [];
            values.forEach((row, r) => {
                if (row.some(c => HEADER_MARK.includes(String(c).trim()))) headerStarts.push(r);
            });
            if (headerStarts.length >= 2) {
                return {
                    ranges: headerStarts.map((s, i) => ({ start: s, end: i + 1 < headerStarts.length ? headerStarts[i + 1] : values.length })),
                    isMultiBlock: true
                };
            }

            return { ranges: [{ start: 0, end: values.length }], isMultiBlock: false };
        }

        // 시트 값 배열을 분석해서 "월별 블록"과 각 블록의 헤더행/사번열/이름열을 찾는다.
        // 헤더행 마커(사번/근무자)가 아예 없는 시트(달력형/공지문)는 null 반환 → 검색·고정 대상에서 제외.
        function analyzeSheetStructure(values) {
            if (!values || !values.length) return null;

            const { ranges: blockRanges, isMultiBlock } = findBlockRanges(values);

            const blocks = [];
            blockRanges.forEach(({ start, end }) => {
                let headerRowIndex = -1;
                for (let r = start; r < end; r++) {
                    if (values[r].some(c => HEADER_MARK.includes(String(c).trim()))) { headerRowIndex = r; break; }
                }
                if (headerRowIndex === -1) return;

                const headerRow = values[headerRowIndex];
                const idCol = headerRow.findIndex(c => String(c).trim() === '사번');
                const nameCol = headerRow.findIndex(c => ['이름', '근무자'].includes(String(c).trim()));
                if (nameCol === -1) return;

                let headerRowCount = 1;
                if (values[headerRowIndex + 1] && looksLikeWeekdayRow(values[headerRowIndex + 1])) headerRowCount = 2;

                blocks.push({ start, end, headerRowIndex, headerRowCount, idCol, nameCol });
            });

            if (!blocks.length) return null;
            return { blocks, isMultiBlock };
        }

        function buildRowMeta(values, headerRowIndex, headerRowCount, idCol, nameCol) {
            const meta = {};
            for (let r = headerRowIndex + headerRowCount; r < values.length; r++) {
                const name = String((values[r] && values[r][nameCol]) || '').trim();
                if (!name) continue;
                const empId = idCol !== -1 ? String((values[r] && values[r][idCol]) || '').trim() : '';
                const seat = r - (headerRowIndex + headerRowCount);
                meta[r] = { name, empId, seat };
            }
            return meta;
        }

        // 월별 블록을 별도의 payload로 잘라낸다 (merges 좌표도 블록 기준으로 재계산, 열 너비는 시트 전체 기준이라 그대로 물려줌)
        function sliceGrid(payload, start, end) {
            let values = payload.values.slice(start, end).map(r => r.slice());
            let backgrounds = (payload.backgrounds || []).slice(start, end).map(r => r.slice());
            let fontColors = (payload.fontColors || []).slice(start, end).map(r => r.slice());
            let fontWeights = (payload.fontWeights || []).slice(start, end).map(r => r.slice());

            while (values.length > 1 && values[values.length - 1].every(v => !String(v || '').trim())) {
                values.pop(); backgrounds.pop(); fontColors.pop(); fontWeights.pop();
            }

            const merges = (payload.merges || [])
                .filter(m => m.row >= start && m.row < start + values.length)
                .map(m => ({
                    row: m.row - start,
                    col: m.col,
                    numRows: Math.min(m.numRows, values.length - (m.row - start)),
                    numCols: m.numCols
                }))
                .filter(m => m.numRows >= 1);

            return { values, backgrounds, fontColors, fontWeights, merges, columnWidths: payload.columnWidths, gid: payload.gid, name: payload.name };
        }

        // ══════════════════════════ 렌더링 ══════════════════════════
        function buildTable(container, payload, opts) {
            opts = opts || {};
            const rowMeta = opts.rowMeta || {};
            const { values, backgrounds, fontColors, fontWeights, merges, columnWidths } = payload;
            const rowCount = values.length;
            const colCountTotal = rowCount ? values[0].length : 0;

            const covered = new Set();
            const mergeMap = new Map();
            (merges || []).forEach(m => {
                mergeMap.set(m.row + ',' + m.col, m);
                for (let r = m.row; r < m.row + m.numRows; r++) {
                    for (let c = m.col; c < m.col + m.numCols; c++) {
                        if (r === m.row && c === m.col) continue;
                        covered.add(r + ',' + c);
                    }
                }
            });

            const table = document.createElement('table');
            table.className = 'sheet-table';

            // 원본 구글시트 열 너비를 그대로 반영(고정폭 레이아웃) — 없으면 브라우저 기본(내용 기준) 사용
            if (columnWidths && columnWidths.length) {
                const colgroup = document.createElement('colgroup');
                for (let c = 0; c < colCountTotal; c++) {
                    const col = document.createElement('col');
                    const w = columnWidths[c];
                    if (w) col.style.width = w + 'px';
                    colgroup.appendChild(col);
                }
                table.appendChild(colgroup);
            }

            for (let r = 0; r < rowCount; r++) {
                const tr = document.createElement('tr');
                const meta = rowMeta[r];
                if (meta) {
                    tr.dataset.person = meta.name;
                    tr.dataset.empId = meta.empId || '';
                    tr.dataset.seat = String(meta.seat);
                }
                const row = values[r] || [];
                const colCount = row.length;
                for (let c = 0; c < colCount; c++) {
                    const key = r + ',' + c;
                    if (covered.has(key)) continue;
                    const td = document.createElement('td');
                    td.dataset.r = String(r);
                    td.dataset.c = String(c);
                    const m = mergeMap.get(key);
                    if (m) {
                        if (m.numRows > 1) td.rowSpan = m.numRows;
                        if (m.numCols > 1) td.colSpan = m.numCols;
                    }
                    td.textContent = row[c] || '';
                    const bg = backgrounds && backgrounds[r] && backgrounds[r][c];
                    const fc = fontColors && fontColors[r] && fontColors[r][c];
                    const fw = fontWeights && fontWeights[r] && fontWeights[r][c];
                    if (bg && bg.toLowerCase() !== '#ffffff') td.style.backgroundColor = bg;
                    if (fc && fc.toLowerCase() !== '#000000') td.style.color = fc;
                    if (fw === 'bold') td.style.fontWeight = '700';
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }

            container.appendChild(table);
            return table;
        }

        // rowStart~rowStart+rowCount 행을 상단 고정, 0~colCount-1 열을 좌측 고정
        function finalizeSticky(table, { rowStart = 0, rowCount = 0, colCount = 0 }) {
            const rows = Array.from(table.rows);
            if (!rows.length) return;

            const leftOffsets = [];
            for (let c = 0; c < colCount; c++) {
                let found = null;
                for (const tr of rows) {
                    const td = Array.from(tr.cells).find(td => Number(td.dataset.c) === c);
                    if (td) { found = td; break; }
                }
                leftOffsets[c] = found ? found.offsetLeft : (c > 0 ? leftOffsets[c - 1] : 0);
            }

            const topOffsets = {};
            let acc = 0;
            for (let i = 0; i < rowCount; i++) {
                const rIdx = rowStart + i;
                if (!rows[rIdx]) break;
                topOffsets[rIdx] = acc;
                acc += rows[rIdx].offsetHeight;
            }

            rows.forEach((tr, rIdx) => {
                const isFrozenRow = rIdx >= rowStart && rIdx < rowStart + rowCount;
                Array.from(tr.cells).forEach(td => {
                    const c = Number(td.dataset.c);
                    const isFrozenCol = colCount > 0 && c < colCount;
                    if (!isFrozenRow && !isFrozenCol) return;
                    td.style.position = 'sticky';
                    if (isFrozenRow) td.style.top = (topOffsets[rIdx] || 0) + 'px';
                    if (isFrozenCol) td.style.left = (leftOffsets[c] || 0) + 'px';
                    td.style.zIndex = (isFrozenRow && isFrozenCol) ? '3' : (isFrozenRow || isFrozenCol) ? '2' : '1';
                    if (!td.style.backgroundColor) td.style.backgroundColor = '#ffffff';
                });
            });
        }

        function renderSheetInto(container, group, payload) {
            container.innerHTML = '';
            const structure = analyzeSheetStructure(payload.values);
            const sticky = isStickyTarget(group, payload.name);

            if (structure && structure.isMultiBlock) {
                structure.blocks.forEach(block => {
                    const sub = sliceGrid(payload, block.start, block.end);
                    const wrap = document.createElement('div');
                    wrap.className = 'sheet-block-wrap';
                    container.appendChild(wrap);
                    const localHeaderIdx = block.headerRowIndex - block.start;
                    const rowMeta = buildRowMeta(sub.values, localHeaderIdx, block.headerRowCount, block.idCol, block.nameCol);
                    const table = buildTable(wrap, sub, { rowMeta });
                    if (sticky) finalizeSticky(table, { rowStart: localHeaderIdx, rowCount: block.headerRowCount, colCount: 1 });
                });
            } else {
                const rowMeta = structure
                    ? buildRowMeta(payload.values, structure.blocks[0].headerRowIndex, structure.blocks[0].headerRowCount, structure.blocks[0].idCol, structure.blocks[0].nameCol)
                    : {};
                const table = buildTable(container, payload, { rowMeta });
                if (sticky && structure) {
                    const b = structure.blocks[0];
                    finalizeSticky(table, { rowStart: b.headerRowIndex, rowCount: b.headerRowCount, colCount: Math.max(b.idCol, b.nameCol) + 1 });
                }
            }
        }

        async function openSheet(group, gid) {
            const loadingOverlay = document.getElementById('loading-overlay');
            loadingOverlay.classList.remove('hidden');
            currentRenderedKey = null;
            try {
                const payload = await fetchSingleSheet(group, gid);
                const container = document.getElementById('sheet-container');
                renderSheetInto(container, group, payload);
                currentRenderedKey = `${group}:${gid}`;
            } catch (err) {
                console.error(err);
                document.getElementById('sheet-container').innerHTML =
                    "<p class='p-6 text-sm text-red-500'>시트를 불러오지 못했습니다.</p>";
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        // ══════════════════════════ 검색 ══════════════════════════
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[ch]);
        }

        function waitFor(cond, timeout = 6000, interval = 50) {
            return new Promise(resolve => {
                const start = Date.now();
                (function tick() {
                    if (cond() || Date.now() - start > timeout) return resolve();
                    setTimeout(tick, interval);
                })();
            });
        }

        function highlightRow(rec) {
            const container = document.getElementById('sheet-container');
            const trs = container.querySelectorAll('tr[data-person]');
            let target = null;
            trs.forEach(tr => {
                tr.classList.remove('row-highlight');
                if (target) return;
                if (tr.dataset.person !== rec.name) return;
                // 사번이 있으면 사번으로, 없으면(동명이인 구분용) 시트 안에서의 줄 위치(seat)로 매칭
                const idMatches = rec.empId ? tr.dataset.empId === rec.empId : String(tr.dataset.seat) === String(rec.seat);
                if (idMatches) target = tr;
            });
            if (target) {
                target.classList.add('row-highlight');
                target.scrollIntoView({ block: 'center', inline: 'start', behavior: 'smooth' });
                setTimeout(() => target.classList.remove('row-highlight'), 4000);
            }
        }

        async function goToRecord(rec) {
            const groupBtn = document.getElementById(`btn-${rec.group}`);
            if (groupBtn) groupBtn.click();
            await waitFor(() => document.getElementById(`${rec.group}-sub`).childElementCount > 0);

            const subContainer = document.getElementById(`${rec.group}-sub`);
            const btn = Array.from(subContainer.children).find(b => String(b.dataset.gid) === String(rec.gid));
            if (!btn) return;
            btn.click();

            await waitFor(() => currentRenderedKey === `${rec.group}:${rec.gid}`);
            highlightRow(rec);
        }

        let searchDebounceTimer = null;
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchDebounceTimer);
            const q = e.target.value.trim();
            searchDebounceTimer = setTimeout(() => runSearch(q), 150);
        });

        async function runSearch(q) {
            const dropdown = document.getElementById('search-dropdown');
            const status = document.getElementById('search-status');

            if (!q) {
                dropdown.classList.add('hidden');
                dropdown.innerHTML = '';
                status.textContent = '';
                return;
            }

            status.textContent = '검색 중...';
            const [recs1, recs2] = await Promise.all([ensureGroupIndexed('group1'), ensureGroupIndexed('group2')]);
            const all = [...recs1, ...recs2];
            const ql = q.toLowerCase();
            const matches = all.filter(r =>
                r.name.toLowerCase().includes(ql) || (r.empId && r.empId.toLowerCase().includes(ql))
            );

            status.textContent = matches.length ? `${matches.length}건` : '결과 없음';
            dropdown.innerHTML = '';

            if (!matches.length) {
                dropdown.classList.remove('hidden');
                return;
            }

            matches.slice(0, 30).forEach(rec => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'search-item block w-full text-left px-3 py-2 text-sm border-b border-gray-100';
                const dupHint = (!rec.empId && rec.duplicateCount > 1)
                    ? `<span class="text-amber-600">· 동명이인 ${rec.seat + 1}/${rec.duplicateCount}번째 줄</span>`
                    : '';
                item.innerHTML = `
                    <span class="font-medium">${escapeHtml(rec.name)}</span>
                    ${rec.empId ? `<span class="text-gray-400">(${escapeHtml(rec.empId)})</span>` : ''}
                    <br>
                    <span class="text-[10px] text-gray-400 uppercase tracking-wide">${escapeHtml(rec.groupName)} · ${escapeHtml(rec.sheetName)} ${dupHint}</span>
                `;
                item.onclick = () => {
                    dropdown.classList.add('hidden');
                    goToRecord(rec);
                };
                dropdown.appendChild(item);
            });

            dropdown.classList.remove('hidden');
        }

        document.addEventListener('click', (e) => {
            const bar = document.getElementById('search-bar');
            if (bar && !bar.contains(e.target)) {
                document.getElementById('search-dropdown').classList.add('hidden');
            }
        });

        // ══════════════════════════ 탭 UI ══════════════════════════
        function toggleGroup(groupKey, buttonEl) {
            document.getElementById('group1-sub').classList.add('hidden');
            document.getElementById('group1-sub').classList.remove('flex');
            document.getElementById('group2-sub').classList.add('hidden');
            document.getElementById('group2-sub').classList.remove('flex');

            const container = document.getElementById(`${groupKey}-sub`);
            container.classList.remove('hidden');
            container.classList.add('flex');

            document.querySelectorAll(".main-tab").forEach(btn => btn.dataset.active = "false");
            buttonEl.dataset.active = "true";

            if (container.childElementCount > 0) return;

            const loadingOverlay = document.getElementById("loading-overlay");
            loadingOverlay.classList.remove("hidden");

            const { api } = sheetGroups[groupKey];

            fetch(api)
                .then(res => res.json())
                .then(sheets => {
                    container.innerHTML = '';
                    sheets.forEach(({ name, gid }, index) => {
                        const btn = document.createElement("button");
                        btn.textContent = name;

                        btn.className = "sub-btn text-sm text-gray-600 hover:text-black";
                        btn.dataset.active = "false";
                        btn.dataset.gid = gid;

                        btn.onclick = () => {
                            openSheet(groupKey, gid);

                            document.querySelectorAll(".sub-btn").forEach(b => {
                                b.dataset.active = "false";
                                b.classList.remove("text-black");
                                b.classList.add("text-gray-600");
                            });
                            btn.dataset.active = "true";
                            btn.classList.remove("text-gray-600");
                            btn.classList.add("text-black");
                        };
                        container.appendChild(btn);

                        if (groupKey === 'group1' && index === 0) {
                            btn.click();
                        }
                    });
                })
                .catch(err => {
                    container.innerHTML = "<p class='text-red-500 text-xs font-medium'>데이터를 불러오지 못했습니다.</p>";
                    console.error(err);
                })
                .finally(() => {
                    loadingOverlay.classList.add("hidden");
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const groupKey = urlParams.get('group');
            const sheetName = urlParams.get('sheet');

            if (!(groupKey && sheetName)) {
                document.getElementById("btn-group1")?.click();
            } else {
                const targetGroupBtn = document.getElementById(`btn-${groupKey}`);
                if (targetGroupBtn) targetGroupBtn.click();

                if (sheetGroups[groupKey]) {
                    fetch(sheetGroups[groupKey].api)
                        .then(res => res.json())
                        .then(sheets => {
                            const match = sheets.find(s => s.name === sheetName);
                            if (match) {
                                openSheet(groupKey, match.gid);

                                setTimeout(() => {
                                    const subContainer = document.getElementById(`${groupKey}-sub`);
                                    const buttons = subContainer.getElementsByTagName('button');
                                    for (let btn of buttons) {
                                        if (btn.textContent === sheetName) {
                                            document.querySelectorAll(".sub-btn").forEach(b => {
                                                b.dataset.active = "false";
                                                b.classList.remove("text-black");
                                                b.classList.add("text-gray-600");
                                            });
                                            btn.dataset.active = "true";
                                            btn.classList.remove("text-gray-600");
                                            btn.classList.add("text-black");
                                            break;
                                        }
                                    }
                                }, 1000);
                            }
                        });
                }
            }
        });
    </script>
</body>
</html>
