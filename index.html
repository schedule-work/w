<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DNS > 임상지원 근무표</title>
    <link rel="icon" type="image/png" href="IMG_385.png?v=2">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-bg: #fdfcf7; 
            --ink-black: #111111;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--paper-bg);
            color: var(--ink-black);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .font-editorial {
            font-family: 'Playfair Display', serif;
        }

        .border-editorial {
            border-color: var(--ink-black);
        }

        .main-tab {
            transition: all 0.2s ease;
            position: relative;
        }
        .main-tab[data-active="true"] {
            background-color: var(--ink-black);
            color: var(--paper-bg);
        }
        .main-tab[data-active="false"]:hover {
            background-color: #f0eee1;
        }

        .sub-menu-container {
            display: flex;
            overflow-x: auto;
            align-items: center;
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
        .sub-menu-container::-webkit-scrollbar {
            display: none; 
        }

        .sub-btn {
            white-space: nowrap;
            position: relative;
            padding: 0.25rem 0;
            transition: color 0.2s;
        }
        .sub-btn[data-active="true"] {
            font-weight: 600;
        }
        .sub-btn[data-active="true"]::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: var(--ink-black);
        }

        .marquee-container {
            background-color: var(--ink-black);
            color: var(--paper-bg);
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee-content {
            display: inline-block;
            animation: marquee 30s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <header class="border-b border-editorial flex flex-col sm:flex-row justify-between items-center sm:items-end px-6 py-4 shrink-0">
        <div class="text-center sm:text-left mb-2 sm:mb-0">
            <h1 class="font-editorial text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight uppercase leading-none">
                Shift Schedule
            </h1>
            <p class="text-[10px] sm:text-xs tracking-[0.2em] uppercase mt-2 text-gray-600 font-medium">
                Korea University Guro Hospital • Department of Nursing Service
            </p>
        </div>
        <div class="text-center sm:text-right flex flex-col justify-end">
            <p class="text-[10px] font-medium tracking-widest uppercase border-b border-editorial pb-1 mb-1">
                임상지원간호팀
            </p>
            <p class="text-[10px] text-gray-500 tracking-wider">
                VOL. 2026
            </p>
        </div>
    </header>

    <nav class="border-b border-editorial flex flex-col md:flex-row shrink-0 bg-white">
        <div class="flex border-b md:border-b-0 md:border-r border-editorial shrink-0">
            <button id="btn-group1" class="main-tab px-6 py-3 text-sm font-semibold tracking-wider" onclick="toggleGroup('group1', this)">
                진료지원
            </button>
            <button id="btn-group2" class="main-tab px-6 py-3 text-sm font-semibold tracking-wider border-l border-editorial" onclick="toggleGroup('group2', this)">
                전담간호사
            </button>
        </div>
        
        <div class="flex-1 flex items-center px-6 py-2 overflow-hidden bg-[#faf9f5]">
            <div id="group1-sub" class="sub-menu-container gap-6 hidden w-full"></div>
            <div id="group2-sub" class="sub-menu-container gap-6 hidden w-full"></div>
        </div>
    </nav>

    <main class="flex-1 w-full relative z-0 bg-white">
        <div id="loading-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-20 hidden">
            <div class="font-editorial text-2xl italic tracking-widest animate-pulse border-b border-editorial pb-2">
                Loading Data...
            </div>
        </div>
        
        <iframe id="sheet-frame" class="absolute inset-0 w-full h-full border-0" src=""></iframe>
    </main>

    <footer class="marquee-container py-1.5 shrink-0 text-[10px] tracking-[0.2em] uppercase font-light">
        <div class="marquee-content">
            <span class="mx-6">KOREA UNIVERSITY GURO HOSPITAL</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">KUMC</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">Department of Nursing Service</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">Shift Schedule</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">KOREA UNIVERSITY GURO HOSPITAL</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">KUMC</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">Department of Nursing Service</span>
            <span class="mx-6 text-gray-500">|</span>
            <span class="mx-6">Shift Schedule</span>
            <span class="mx-6 text-gray-500">|</span>
        </div>
    </footer>

    <script>
        const sheetGroups = {
            group1: {
                name: "진료지원",
                pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyaIg5AxN1I8wD2Jrjr1o952ObrO_sHA3vL_Z1403dZLx9u9ooqmlLyuv5fQmeN6HnMmFdIRgCfi7_/pubhtml",
                api: "https://script.google.com/macros/s/AKfycbz_FRqb7fbZwxNg_eWIXjDL15tW8iZGllcs7y6-qzZev7YtFHgRNJUSgm9n7352AZXJYw/exec"
            },
            group2: {
                name: "전담간호사",
                pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSWjnyzr3Qa-UuQ9fRf3lwiRm4vVA7jLOPtJiYe9TU1C-n4dyHcqVk967ahJJWpG_SUbsXwfdBC8Rh-/pubhtml",
                api: "https://script.google.com/macros/s/AKfycbzBpLXtYgjmbzRp74KMrdb2_tZTJYkAQn_aMRQ2AQau3IoofRKA42tzEKpOGn4Hhftmew/exec"
            }
        };

        function toggleGroup(groupKey, buttonEl) {
            document.getElementById('group1-sub').classList.add('hidden');
            document.getElementById('group1-sub').classList.remove('flex');
            document.getElementById('group2-sub').classList.add('hidden');
            document.getElementById('group2-sub').classList.remove('flex');
            
            const container = document.getElementById(`${groupKey}-sub`);
            container.classList.remove('hidden');
            container.classList.add('flex');

            document.querySelectorAll(".main-tab").forEach(btn => btn.dataset.active = "false");
            buttonEl.dataset.active = "true";

            if (container.childElementCount > 0) return;

            const loadingOverlay = document.getElementById("loading-overlay");
            loadingOverlay.classList.remove("hidden");

            const { api, pubhtmlPrefix } = sheetGroups[groupKey];

            fetch(api)
                .then(res => res.json())
                .then(sheets => {
                    container.innerHTML = '';
                    sheets.forEach(({ name, gid }, index) => {
                        const btn = document.createElement("button");
                        btn.textContent = name;
                        
                        btn.className = "sub-btn text-sm text-gray-600 hover:text-black";
                        btn.dataset.active = "false";
                        
                        btn.onclick = () => {
                            document.getElementById("sheet-frame").src = `${pubhtmlPrefix}?gid=${gid}&widget=true&headers=false`;
                            
                            document.querySelectorAll(".sub-btn").forEach(b => {
                                b.dataset.active = "false";
                                b.classList.remove("text-black");
                                b.classList.add("text-gray-600");
                            });
                            btn.dataset.active = "true";
                            btn.classList.remove("text-gray-600");
                            btn.classList.add("text-black");
                        };
                        container.appendChild(btn);

                        if (groupKey === 'group1' && index === 0) {
                            btn.click();
                        }
                    });
                })
                .catch(err => {
                    container.innerHTML = "<p class='text-red-500 text-xs font-medium'>데이터를 불러오지 못했습니다.</p>";
                    console.error(err);
                })
                .finally(() => {
                    loadingOverlay.classList.add("hidden");
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const groupKey = urlParams.get('group');
            const sheetName = urlParams.get('sheet');

            if (!(groupKey && sheetName)) {
                document.getElementById("btn-group1")?.click(); 
                
                fetch(sheetGroups.group1.api)
                    .then(res => res.json())
                    .then(sheets => {
                        const first = sheets[0];
                        if (first) {
                            document.getElementById("sheet-frame").src =
                                `${sheetGroups.group1.pubhtmlPrefix}?gid=${first.gid}&widget=true&headers=false`;
                        }
                    });
            } else {
                const targetGroupBtn = document.getElementById(`btn-${groupKey}`);
                if(targetGroupBtn) targetGroupBtn.click();

                if (sheetGroups[groupKey]) {
                    fetch(sheetGroups[groupKey].api)
                        .then(res => res.json())
                        .then(sheets => {
                            const match = sheets.find(s => s.name === sheetName);
                            if (match) {
                                document.getElementById("sheet-frame").src =
                                    `${sheetGroups[groupKey].pubhtmlPrefix}?gid=${match.gid}&widget=true&headers=false`;
                                
                                setTimeout(() => {
                                    const subContainer = document.getElementById(`${groupKey}-sub`);
                                    const buttons = subContainer.getElementsByTagName('button');
                                    for(let btn of buttons) {
                                        if(btn.textContent === sheetName) {
                                            document.querySelectorAll(".sub-btn").forEach(b => {
                                                b.dataset.active = "false";
                                                b.classList.remove("text-black");
                                                b.classList.add("text-gray-600");
                                            });
                                            btn.dataset.active = "true";
                                            btn.classList.remove("text-gray-600");
                                            btn.classList.add("text-black");
                                            break;
                                        }
                                    }
                                }, 1000);
                            }
                        });
                }
            }
        });
    </script>
</body>
</html>
