<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS > 임상지원 근무표</title>
    <link rel="icon" type="image/png" href="IMG_385.png?v=2">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --app-bg: #f4f7fb;
            --surface: #ffffff;
            --surface-muted: #eef3f8;
            --line: #d8e1eb;
            --ink: #172033;
            --ink-muted: #64748b;
            --navy: #173b63;
            --blue: #2563eb;
            --today: #fff4bf;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--app-bg);
            color: var(--ink);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .border-editorial {
            border-color: var(--line);
        }

        .site-header {
            background: var(--surface);
            border-color: var(--line);
        }

        .brand-mark {
            width: 2.5rem;
            height: 2.5rem;
            display: grid;
            place-items: center;
            border-radius: 0.75rem;
            background: var(--navy);
            color: white;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .site-title {
            color: var(--ink);
            letter-spacing: -0.04em;
        }

        .section-nav {
            background: var(--surface);
            border-color: var(--line);
        }

        .main-tab {
            transition: background-color 0.2s ease, color 0.2s ease;
            position: relative;
            color: var(--ink-muted);
        }
        .main-tab[data-active="true"] {
            background-color: var(--navy);
            color: white;
        }
        .main-tab[data-active="false"]:hover {
            background-color: var(--surface-muted);
            color: var(--navy);
        }
        .main-tab:focus-visible,
        .sub-btn:focus-visible,
        #person-search:focus-visible,
        #toggle-search:focus-visible,
        #search-person:focus-visible,
        #clear-person-search:focus-visible {
            outline: 3px solid #f5c542;
            outline-offset: 2px;
        }

        .sub-menu-container {
            display: flex;
            overflow-x: auto;
            align-items: center;
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
        .sub-menu-container::-webkit-scrollbar {
            display: none; 
        }

        .sub-btn {
            white-space: nowrap;
            position: relative;
            padding: 0.45rem 0.75rem;
            border: 1px solid transparent;
            border-radius: 999px;
            color: var(--ink-muted);
            transition: color 0.2s, background-color 0.2s, border-color 0.2s;
        }
        .sub-btn[data-active="true"] {
            font-weight: 600;
            color: var(--navy);
            background: #e6eef8;
            border-color: #b8cbe0;
        }

        .sub-btn:hover {
            color: var(--navy);
            background: var(--surface-muted);
        }

        .search-panel {
            max-height: min(42vh, 420px);
            overflow-y: auto;
            background: var(--surface);
        }

        .search-panel h2 {
            color: var(--navy);
        }

        .schedule-shell {
            min-height: 0;
            flex: 1;
            margin: 1rem;
            margin-top: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 0.75rem;
            background: var(--surface);
            box-shadow: 0 4px 16px rgba(23, 59, 99, 0.06);
        }

        .site-footer {
            color: var(--ink-muted);
            border-color: var(--line);
            background: var(--surface);
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-pulse {
                animation: none;
            }
        }

        @media (max-width: 640px) {
            .site-header {
                padding: 0.85rem 1rem;
            }
            .site-title {
                font-size: 1.1rem;
            }
            .section-nav > div:first-child {
                width: 100%;
            }
            .main-tab {
                flex: 1;
                padding: 0.75rem 0.5rem;
                font-size: 0.8rem;
            }
            .section-nav > div:last-child {
                padding: 0.5rem 0.75rem;
            }
            .search-panel {
                max-height: 48vh;
                padding: 0.75rem;
            }
            .schedule-shell {
                margin: 0.5rem;
                margin-top: 0;
                border-radius: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <header class="site-header border-b flex items-center justify-between px-6 py-3 shrink-0">
        <div class="flex min-w-0 items-center gap-3">
            <div class="brand-mark" aria-hidden="true">KU</div>
            <div class="min-w-0">
                <p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500">Korea University Guro Hospital</p>
                <h1 class="site-title truncate text-xl font-bold sm:text-2xl">간호부 근무표</h1>
            </div>
        </div>
        <div class="hidden text-right sm:block">
            <p class="text-xs font-semibold text-slate-700">Department of Nursing Service</p>
            <p class="mt-1 text-[11px] text-slate-500">SHIFT SCHEDULE · 2026</p>
        </div>
    </header>

    <nav class="section-nav border-b flex flex-col md:flex-row shrink-0" aria-label="근무표 구분">
        <div class="flex shrink-0 border-b border-editorial md:border-b-0 md:border-r">
            <button id="btn-group1" role="tab" aria-selected="false" aria-controls="group1-sub" class="main-tab px-6 py-3 text-sm font-semibold tracking-wider" onclick="toggleGroup('group1', this)">
                진료지원
            </button>
            <button id="btn-group2" role="tab" aria-selected="false" aria-controls="group2-sub" class="main-tab px-6 py-3 text-sm font-semibold tracking-wider border-l border-editorial" onclick="toggleGroup('group2', this)">
                전담간호사
            </button>
        </div>
        
        <div class="flex-1 flex items-center overflow-hidden bg-slate-50 px-6 py-2">
            <div id="group1-sub" class="sub-menu-container gap-6 hidden w-full"></div>
            <div id="group2-sub" class="sub-menu-container gap-6 hidden w-full"></div>
        </div>
    </nav>

    <main class="flex flex-1 w-full min-h-0 flex-col relative z-0 bg-white">
        <section id="search-panel" class="search-panel relative shrink-0 border-b border-editorial px-4 py-3" aria-labelledby="search-title">
            <div class="flex items-center justify-between gap-3">
                <h2 id="search-title" class="font-semibold text-sm whitespace-nowrap">개인 근무표 검색</h2>
                <button id="toggle-search" type="button" class="border border-gray-400 px-3 py-1.5 text-xs hover:border-black" aria-expanded="true" aria-controls="search-content">검색창 숨기기</button>
            </div>
            <div id="search-content">
                <div class="mt-2 flex flex-col gap-2 sm:flex-row sm:items-center">
                    <div class="flex flex-1 gap-2">
                        <label for="person-search" class="sr-only">이름 또는 사번</label>
                        <input id="person-search" type="search" class="min-w-0 flex-1 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-blue-600" placeholder="이름 또는 사번 입력" autocomplete="off">
                        <button id="search-person" type="button" class="rounded-md bg-blue-700 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800">검색</button>
                        <button id="clear-person-search" type="button" class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-700 hover:border-slate-500">초기화</button>
                    </div>
                </div>
                <p id="search-status" class="mt-2 text-xs text-gray-600" role="status" aria-live="polite">시트를 선택한 뒤 이름 또는 사번을 검색하세요.</p>
                <div id="search-results" class="mt-3 hidden overflow-x-auto"></div>
            </div>
        </section>
        <div id="loading-overlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex items-center justify-center z-20 hidden" role="status" aria-live="polite">
            <div id="loading-message" class="font-editorial text-2xl italic tracking-widest animate-pulse border-b border-editorial pb-2">
                Loading Data...
            </div>
        </div>
        <div id="sheet-error" class="absolute inset-0 hidden items-center justify-center z-10 bg-white px-6 text-center" role="alert">
            <div>
                <p class="font-editorial text-2xl italic mb-2">Unable to load the schedule.</p>
                <p class="text-sm text-gray-600">네트워크 상태를 확인한 뒤 다시 시도해 주세요.</p>
                <button id="retry-sheet" type="button" class="mt-4 border border-black px-4 py-2 text-sm hover:bg-black hover:text-white">다시 시도</button>
            </div>
        </div>
        <div class="schedule-shell flex">
            <iframe id="sheet-frame" class="relative min-h-0 flex-1 w-full border-0" title="근무표" src=""></iframe>
        </div>
    </main>

    <footer class="site-footer border-t px-6 py-2 text-center text-[10px] tracking-wide sm:text-left">
        고려대학교 구로병원 · 간호부 근무표
    </footer>

    <script>
        const sheetGroups = {
            group1: {
                name: "진료지원",
                pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRyaIg5AxN1I8wD2Jrjr1o952ObrO_sHA3vL_Z1403dZLx9u9ooqmlLyuv5fQmeN6HnMmFdIRgCfi7_/pubhtml",
                api: "https://script.google.com/macros/s/AKfycbz_FRqb7fbZwxNg_eWIXjDL15tW8iZGllcs7y6-qzZev7YtFHgRNJUSgm9n7352AZXJYw/exec"
            },
            group2: {
                name: "전담간호사",
                pubhtmlPrefix: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSWjnyzr3Qa-UuQ9fRf3lwiRm4vVA7jLOPtJiYe9TU1C-n4dyHcqVk967ahJJWpG_SUbsXwfdBC8Rh-/pubhtml",
                api: "https://script.google.com/macros/s/AKfycbzBpLXtYgjmbzRp74KMrdb2_tZTJYkAQn_aMRQ2AQau3IoofRKA42tzEKpOGn4Hhftmew/exec"
            }
        };

        const elements = {
            frame: document.getElementById("sheet-frame"),
            loadingOverlay: document.getElementById("loading-overlay"),
            loadingMessage: document.getElementById("loading-message"),
            error: document.getElementById("sheet-error"),
            retry: document.getElementById("retry-sheet")
            ,searchInput: document.getElementById("person-search")
            ,searchButton: document.getElementById("search-person")
            ,clearSearchButton: document.getElementById("clear-person-search")
            ,searchStatus: document.getElementById("search-status")
            ,searchResults: document.getElementById("search-results")
            ,searchContent: document.getElementById("search-content")
            ,toggleSearchButton: document.getElementById("toggle-search")
        };
        let activeSheetUrl = "";
        let activeCsvUrl = "";
        let frameLoadTimer;

        function setLoading(message) {
            elements.loadingMessage.textContent = message;
            elements.loadingOverlay.classList.remove("hidden");
        }

        function clearLoading() {
            elements.loadingOverlay.classList.add("hidden");
        }

        function setSheetError(isVisible) {
            elements.error.classList.toggle("hidden", !isVisible);
            elements.error.classList.toggle("flex", isVisible);
        }

        function loadSheet(url, csvUrl) {
            activeSheetUrl = url;
            activeCsvUrl = csvUrl;
            setSheetError(false);
            setLoading("Loading Schedule...");
            elements.frame.src = url;
            clearTimeout(frameLoadTimer);
            frameLoadTimer = setTimeout(() => {
                clearLoading();
                setSheetError(true);
            }, 15000);
        }

        function toggleGroup(groupKey, buttonEl, requestedSheetName = "") {
            document.getElementById('group1-sub').classList.add('hidden');
            document.getElementById('group1-sub').classList.remove('flex');
            document.getElementById('group2-sub').classList.add('hidden');
            document.getElementById('group2-sub').classList.remove('flex');
            
            const container = document.getElementById(`${groupKey}-sub`);
            container.classList.remove('hidden');
            container.classList.add('flex');

            document.querySelectorAll(".main-tab").forEach(btn => {
                btn.dataset.active = "false";
                btn.setAttribute("aria-selected", "false");
            });
            buttonEl.dataset.active = "true";
            buttonEl.setAttribute("aria-selected", "true");

            if (container.childElementCount > 0) {
                if (requestedSheetName) {
                    [...container.querySelectorAll(".sub-btn")]
                        .find(btn => btn.textContent === requestedSheetName)?.click();
                }
                return;
            }

            activeSheetUrl = "";
            setLoading("Loading Sheet List...");

            const { api, pubhtmlPrefix } = sheetGroups[groupKey];

            fetch(api)
                .then(res => {
                    if (!res.ok) throw new Error(`Sheet list request failed: ${res.status}`);
                    return res.json();
                })
                .then(sheets => {
                    if (!Array.isArray(sheets)) throw new Error("Invalid sheet list response");
                    container.innerHTML = '';
                    sheets.forEach(({ name, gid }, index) => {
                        const btn = document.createElement("button");
                        btn.textContent = name;
                        
                        btn.className = "sub-btn text-sm text-gray-600 hover:text-black";
                        btn.dataset.active = "false";
                        
                        btn.onclick = () => {
                            const sheetUrl = `${pubhtmlPrefix}?gid=${encodeURIComponent(gid)}&widget=true&headers=false`;
                            const csvUrl = `${pubhtmlPrefix.replace(/\/pubhtml$/, '')}/pub?output=csv&gid=${encodeURIComponent(gid)}`;
                            loadSheet(sheetUrl, csvUrl);
                            elements.searchInput.value = "";
                            elements.searchResults.classList.add("hidden");
                            elements.searchStatus.textContent = "시트를 선택했습니다. 이름 또는 사번을 검색하세요.";
                            
                            document.querySelectorAll(".sub-btn").forEach(b => {
                                b.dataset.active = "false";
                                b.classList.remove("text-black");
                                b.classList.add("text-gray-600");
                            });
                            btn.dataset.active = "true";
                            btn.classList.remove("text-gray-600");
                            btn.classList.add("text-black");
                        };
                        container.appendChild(btn);

                        if (name === requestedSheetName || (!requestedSheetName && index === 0)) {
                            btn.click();
                        }
                    });
                })
                .catch(err => {
                    container.innerHTML = "<p class='text-red-500 text-xs font-medium'>데이터를 불러오지 못했습니다.</p>";
                    console.error(err);
                })
                .finally(() => {
                    if (!activeSheetUrl) clearLoading();
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const groupKey = urlParams.get('group');
            const sheetName = urlParams.get('sheet');

            const initialGroupKey = sheetGroups[groupKey] ? groupKey : "group1";
            const targetGroupBtn = document.getElementById(`btn-${initialGroupKey}`);
            if (targetGroupBtn) toggleGroup(initialGroupKey, targetGroupBtn, sheetName || "");
        });

        elements.frame.addEventListener("load", () => {
            clearTimeout(frameLoadTimer);
            clearLoading();
            setSheetError(false);
        });

        elements.frame.addEventListener("error", () => {
            clearTimeout(frameLoadTimer);
            clearLoading();
            setSheetError(true);
        });

        elements.retry.addEventListener("click", () => {
            if (activeSheetUrl) loadSheet(activeSheetUrl, activeCsvUrl);
        });

        function parseCsv(csv) {
            const rows = [];
            let row = [];
            let cell = "";
            let quoted = false;

            for (let i = 0; i < csv.length; i += 1) {
                const char = csv[i];
                const next = csv[i + 1];
                if (char === '"' && quoted && next === '"') {
                    cell += '"';
                    i += 1;
                } else if (char === '"') {
                    quoted = !quoted;
                } else if (char === ',' && !quoted) {
                    row.push(cell.trim());
                    cell = "";
                } else if ((char === '\n' || char === '\r') && !quoted) {
                    if (char === '\r' && next === '\n') i += 1;
                    row.push(cell.trim());
                    if (row.some(value => value !== "")) rows.push(row);
                    row = [];
                    cell = "";
                } else {
                    cell += char;
                }
            }
            if (cell || row.length) {
                row.push(cell.trim());
                if (row.some(value => value !== "")) rows.push(row);
            }
            return rows;
        }

        function getTodayColumnIndex(headers) {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            const day = today.getDate();
            const patterns = [
                `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`,
                `${year}.${String(month).padStart(2, '0')}.${String(day).padStart(2, '0')}`,
                `${month}/${day}`,
                `${month}월${day}일`,
                `${day}일`
            ];
            return headers.findIndex(header => {
                const normalizedHeader = header.replace(/\s/g, '');
                return patterns.some(pattern => normalizedHeader.includes(pattern)) || normalizedHeader === String(day);
            });
        }

        function getColumnIndex(headers, pattern) {
            return headers.findIndex(header => pattern.test(header));
        }

        function renderSearchResults(rows, query) {
            const normalizedQuery = query.replace(/\s/g, '').toLowerCase();
            const headerIndex = Math.max(0, rows.findIndex(row =>
                row.some(value => /이름|성명|사번|사원번호|직번|employee|name|id/i.test(value))
            ));
            const headers = rows[headerIndex] || [];
            const nameIndex = getColumnIndex(headers, /이름|성명|name/i);
            const personColumnIndex = nameIndex >= 0 ? nameIndex : 0;
            const employeeNoIndex = getColumnIndex(headers, /사번|사원번호|직번|employee.?no|employee.?id/i);
            const todayIndex = getTodayColumnIndex(headers);
            const matches = rows.slice(headerIndex + 1).filter(row =>
                row.some(value => value.replace(/\s/g, '').toLowerCase().includes(normalizedQuery))
            );

            elements.searchResults.classList.remove("hidden");
            if (!matches.length) {
                elements.searchResults.innerHTML = '<p class="py-3 text-sm text-gray-600">검색 결과가 없습니다.</p>';
                elements.searchStatus.textContent = `“${query}” 검색 결과가 없습니다.`;
                return;
            }

            const resultParts = [];
            const todaySummary = document.createElement("div");
            todaySummary.className = "mb-3 border border-black bg-white px-3 py-3";
            const todayTitle = document.createElement("p");
            todayTitle.className = "mb-2 font-semibold text-sm";
            todayTitle.textContent = "오늘 근무";
            todaySummary.appendChild(todayTitle);

            if (todayIndex >= 0) {
                matches.forEach(row => {
                    const item = document.createElement("span");
                    item.className = "mr-4 inline-block text-sm";
                    const personName = row[personColumnIndex] || query;
                    const employeeNo = employeeNoIndex >= 0 ? row[employeeNoIndex] : "";
                    item.textContent = `${personName}${employeeNo ? ` (${employeeNo})` : ""}: ${row[todayIndex] || "근무 정보 없음"}`;
                    todaySummary.appendChild(item);
                });
            } else {
                const unavailable = document.createElement("p");
                unavailable.className = "text-sm text-gray-600";
                unavailable.textContent = "현재 시트에서 오늘 날짜 열을 찾지 못했습니다.";
                todaySummary.appendChild(unavailable);
            }
            resultParts.push(todaySummary);

            const table = document.createElement("table");
            table.className = "min-w-full border-collapse text-left text-xs";
            const thead = document.createElement("thead");
            const headRow = document.createElement("tr");
            headers.forEach((header, index) => {
                const th = document.createElement("th");
                th.textContent = header || "-";
                th.className = "border border-gray-300 bg-gray-100 px-3 py-2 font-semibold whitespace-nowrap";
                if (index === personColumnIndex) {
                    th.classList.add("sticky", "left-0", "z-10", "bg-gray-100");
                }
                if (index === todayIndex) {
                    th.classList.add("bg-yellow-100");
                    th.textContent = `${header || "오늘"} (오늘)`;
                }
                headRow.appendChild(th);
            });
            thead.appendChild(headRow);
            table.appendChild(thead);

            const tbody = document.createElement("tbody");
            matches.slice(0, 100).forEach(row => {
                const tr = document.createElement("tr");
                headers.forEach((_, index) => {
                    const td = document.createElement("td");
                    td.textContent = row[index] || "";
                    td.className = "border border-gray-300 bg-white px-3 py-2 whitespace-nowrap";
                    if (index === personColumnIndex) {
                        td.classList.add("sticky", "left-0", "z-[1]", "bg-white", "font-semibold");
                    }
                    if (index === todayIndex) {
                        td.classList.add("bg-yellow-50", "font-semibold");
                    }
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
            resultParts.push(table);
            elements.searchResults.replaceChildren(...resultParts);
            elements.searchStatus.textContent = `${matches.length}건을 찾았습니다${matches.length > 100 ? ' (처음 100건만 표시)' : ''}.`;
        }

        async function searchPerson() {
            const query = elements.searchInput.value.trim();
            if (!query) {
                elements.searchStatus.textContent = "검색어를 입력하세요.";
                elements.searchResults.classList.add("hidden");
                return;
            }
            if (!activeCsvUrl) {
                elements.searchStatus.textContent = "먼저 근무표 시트를 선택하세요.";
                return;
            }

            elements.searchStatus.textContent = "검색 중입니다...";
            try {
                const response = await fetch(activeCsvUrl);
                if (!response.ok) throw new Error(`CSV request failed: ${response.status}`);
                const csv = await response.text();
                renderSearchResults(parseCsv(csv), query);
            } catch (error) {
                console.error(error);
                elements.searchResults.classList.remove("hidden");
                elements.searchResults.innerHTML = '<p class="py-3 text-sm text-red-600">검색 데이터를 불러오지 못했습니다. 공개 CSV 설정과 네트워크 상태를 확인하세요.</p>';
                elements.searchStatus.textContent = "검색에 실패했습니다.";
            }
        }

        elements.searchButton.addEventListener("click", searchPerson);
        elements.searchInput.addEventListener("keydown", event => {
            if (event.key === "Enter") searchPerson();
        });
        elements.clearSearchButton.addEventListener("click", () => {
            elements.searchInput.value = "";
            elements.searchResults.classList.add("hidden");
            elements.searchStatus.textContent = activeCsvUrl
                ? "이름 또는 사번을 검색하세요."
                : "시트를 선택한 뒤 이름 또는 사번을 검색하세요.";
            elements.searchInput.focus();
        });

        elements.toggleSearchButton.addEventListener("click", () => {
            const isExpanded = elements.toggleSearchButton.getAttribute("aria-expanded") === "true";
            elements.searchContent.classList.toggle("hidden", isExpanded);
            elements.toggleSearchButton.setAttribute("aria-expanded", String(!isExpanded));
            elements.toggleSearchButton.textContent = isExpanded ? "검색창 열기" : "검색창 숨기기";
        });
    </script>
</body>
</html>
