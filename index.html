            width: 8px;
            height: 8px;

            border-radius: 50%;
            background-color: #2563eb;
            left: 15%;
            transform-origin: 50%;

        @media (prefers-color-scheme: dark) {

                background-color: #60a5fa;

        @keyframes typing-circle7124 {
            0% {

            40% {
                height: 8px;
                border-radius: 50%;
                transform: scaleX(1);
            }
            100% {
                top: 0%;
            }
        }

        .typing-circle:nth-child(2) {
            left: 45%;
            animation-delay: 0.2s;
        }

        .typing-circle:nth-child(3) {
            left: auto;
            right: 15%;

            100% {

            "92병동", "93병동", "95병동", "100병동", "101병동", "분만실", "내시경실", "심혈관센터", "암병원", "응급실",
            "인공신장실", "1신경계중환자실", "2신경계중환자실", "내과중환자실", "마취통증의학과", "수술실", "신생아중환자실",
            "심혈관계중환자실", "외과중환자실", "응급중환자실", "중앙공급실", "보호요원실", "간호교육기획팀"
        ];

        const TIME_OPTIONS = [
            "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30",
            "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00",
            "15:30", "16:00", "16:30", "17:00", "17:30"
        ];

        // -------------------------------------------------------------
        // 2. React Bits - DotField 컴포넌트 (로그인 인터랙티브 배경)
        // -------------------------------------------------------------
        // -------------------------------------------------------------
        // 2. React Bits - DotField 컴포넌트 (다크/라이트 자동감지 & 가시성 대폭 강화)
        // -------------------------------------------------------------
        const DotField = React.memo(({
            dotRadius = 2.4,        // ⚡ 점 크기를 2.4로 키워 확실한 가시성 확보
            dotSpacing = 18,       // ⚡ 시원한 간격
            cursorRadius = 450,    // ⚡ 넓은 마우스 반응 반경
            cursorForce = 0.15,
            bulgeOnly = true,
            bulgeStrength = 85,    // ⚡ 마우스 호버 시 돋보기 효과 대폭 강화
            glowRadius = 220,      // ⚡ 부드러운 오라 글로우
            sparkle = true,        // ⚡ 별빛 반짝임 효과
            waveAmplitude = 3.5,   // ⚡ 가만히 있어도 살아 숨쉬듯 은은하게 움직이는 파도 애니메이션
            gradientFrom,
            gradientTo,
            glowColor,
            ...rest
        }) => {
            const canvasRef = React.useRef(null);
            const svgRef = React.useRef(null);
            const glowRef = React.useRef(null);
            const dotsRef = React.useRef([]);
            const mouseRef = React.useRef({ x: -9999, y: -9999, prevX: -9999, prevY: -9999, speed: 0 });
            const rafRef = React.useRef(null);
            const sizeRef = React.useRef({ w: 0, h: 0, offsetX: 0, offsetY: 0 });
            const glowOpacity = React.useRef(0);
            const engagement = React.useRef(0);
            const propsRef = React.useRef({});
            const rebuildRef = React.useRef(null);
            const glowIdRef = React.useRef(`dot-field-glow-${Math.random().toString(36).slice(2, 9)}`);

            // ⚡ 1. 다크모드 / 라이트모드 실시간 자동 감지
            const [isDarkMode, setIsDarkMode] = React.useState(() => {
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            React.useEffect(() => {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handler = (e) => setIsDarkMode(e.matches);
                mediaQuery.addEventListener('change', handler);
                return () => mediaQuery.removeEventListener('change', handler);
            }, []);

            // ⚡ 2. 테마별 뚜렷하고 세련된 색상 매핑
            const activeGradFrom = gradientFrom || (isDarkMode ? 'rgba(96, 165, 250, 0.70)' : 'rgba(37, 99, 235, 0.55)');
            const activeGradTo = gradientTo || (isDarkMode ? 'rgba(167, 139, 250, 0.55)' : 'rgba(99, 102, 241, 0.40)');
            const activeGlow = glowColor || (isDarkMode ? 'rgba(96, 165, 250, 0.35)' : 'rgba(37, 99, 235, 0.22)');

            propsRef.current = { 
                dotRadius, 
                dotSpacing, 
                cursorRadius, 
                cursorForce, 
                bulgeOnly, 
                bulgeStrength, 
                sparkle, 
                waveAmplitude, 
                gradientFrom: activeGradFrom, 
                gradientTo: activeGradTo 
            };

            React.useEffect(() => {
                const canvas = canvasRef.current;
                const glowEl = glowRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d', { alpha: true });
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                let resizeTimer;

                function resize() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(doResize, 100);
                }

                function doResize() {
                    const rect = canvas.parentElement.getBoundingClientRect();
                    const w = rect.width;
                    const h = rect.height;

                    canvas.width = w * dpr;
                    canvas.height = h * dpr;
                    canvas.style.width = `${w}px`;
                    canvas.style.height = `${h}px`;
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                    sizeRef.current = {
                        w,
                        h,
                        offsetX: rect.left + window.scrollX,
                        offsetY: rect.top + window.scrollY,
                    };

                    buildDots(w, h);
                }

                function buildDots(w, h) {
                    const p = propsRef.current;
                    const step = p.dotRadius + p.dotSpacing;
                    const cols = Math.floor(w / step);
                    const rows = Math.floor(h / step);
                    const padX = (w % step) / 2;
                    const padY = (h % step) / 2;
                    const dots = new Array(rows * cols);
                    let idx = 0;

                    for (let row = 0; row < rows; row++) {
                        for (let col = 0; col < cols; col++) {
                            const ax = padX + col * step + step / 2;
                            const ay = padY + row * step + step / 2;
                            dots[idx++] = { ax, ay, sx: ax, sy: ay, vx: 0, vy: 0, x: ax, y: ay };
                        }
                    }
                    dotsRef.current = dots;
                }

                function onMouseMove(e) {
                    const s = sizeRef.current;
                    mouseRef.current.x = e.pageX - s.offsetX;
                    mouseRef.current.y = e.pageY - s.offsetY;
                }

                function updateMouseSpeed() {
                    const m = mouseRef.current;
                    const dx = m.prevX - m.x;
                    const dy = m.prevY - m.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    m.speed += (dist - m.speed) * 0.5;
                    if (m.speed < 0.001) m.speed = 0;
                    m.prevX = m.x;
                    m.prevY = m.y;
                }

                const speedInterval = setInterval(updateMouseSpeed, 20);
                let frameCount = 0;

                function tick() {
                    frameCount++;
                    const dots = dotsRef.current;
                    const m = mouseRef.current;
                    const { w, h } = sizeRef.current;
                    const p = propsRef.current;
                    const len = dots.length;
                    const t = frameCount * 0.02;

                    const targetEngagement = Math.min(m.speed / 5, 1);
                    engagement.current += (targetEngagement - engagement.current) * 0.06;
                    if (engagement.current < 0.001) engagement.current = 0;
                    const eng = engagement.current;

                    glowOpacity.current += (eng - glowOpacity.current) * 0.08;

                    if (glowEl) {
                        glowEl.setAttribute('cx', m.x);
                        glowEl.setAttribute('cy', m.y);
                        glowEl.style.opacity = glowOpacity.current;
                    }

                    ctx.clearRect(0, 0, w, h);

                    const grad = ctx.createLinearGradient(0, 0, w, h);
                    grad.addColorStop(0, p.gradientFrom);
                    grad.addColorStop(1, p.gradientTo);
                    ctx.fillStyle = grad;

                    const cr = p.cursorRadius;
                    const crSq = cr * cr;
                    const rad = p.dotRadius / 2;
                    const isBulge = p.bulgeOnly;

                    ctx.beginPath();

                    for (let i = 0; i < len; i++) {
                        const d = dots[i];
                        const dx = m.x - d.ax;
                        const dy = m.y - d.ay;
                        const distSq = dx * dx + dy * dy;

                        if (distSq < crSq && eng > 0.01) {
                            const dist = Math.sqrt(distSq);
                            if (isBulge) {
                                const t = 1 - dist / cr;
                                const push = t * t * p.bulgeStrength * eng;
                                const angle = Math.atan2(dy, dx);
                                d.sx += (d.ax - Math.cos(angle) * push - d.sx) * 0.15;
                                d.sy += (d.ay - Math.sin(angle) * push - d.sy) * 0.15;
                            } else {
                                const angle = Math.atan2(dy, dx);
                                const move = (500 / dist) * (m.speed * p.cursorForce);
                                d.vx += Math.cos(angle) * -move;
                                d.vy += Math.sin(angle) * -move;
                            }
                        } else if (isBulge) {
                            d.sx += (d.ax - d.sx) * 0.1;
                            d.sy += (d.ay - d.sy) * 0.1;
                        }

                        if (!isBulge) {
                            d.vx *= 0.9;
                            d.vy *= 0.9;
                            d.x = d.ax + d.vx;
                            d.y = d.ay + d.vy;
                            d.sx += (d.x - d.sx) * 0.1;
                            d.sy += (d.y - d.sy) * 0.1;
                        }

                        let drawX = d.sx;
                        let drawY = d.sy;
                        if (p.waveAmplitude > 0) {
                            drawY += Math.sin(d.ax * 0.03 + t) * p.waveAmplitude;
                            drawX += Math.cos(d.ay * 0.03 + t * 0.7) * (p.waveAmplitude * 0.6);
                        }

                        if (p.sparkle) {
                            const hash = ((i * 2654435761) ^ (frameCount >> 3)) >>> 0;
                            if ((hash % 100) < 3) {
                                ctx.moveTo(drawX + rad * 1.8, drawY);
                                ctx.arc(drawX, drawY, rad * 1.8, 0, Math.PI * 2);
                            } else {
                                ctx.moveTo(drawX + rad, drawY);
                                ctx.arc(drawX, drawY, rad, 0, Math.PI * 2);
                            }
                        } else {
                            ctx.moveTo(drawX + rad, drawY);
                            ctx.arc(drawX, drawY, rad, 0, Math.PI * 2);
                        }
                    }

                    ctx.fill();
                    rafRef.current = requestAnimationFrame(tick);
                }

                doResize();
                window.addEventListener('resize', resize);
                window.addEventListener('mousemove', onMouseMove, { passive: true });
                rafRef.current = requestAnimationFrame(tick);

                rebuildRef.current = () => {
                    const { w, h } = sizeRef.current;
                    if (w > 0 && h > 0) buildDots(w, h);
                };

                return () => {
                    cancelAnimationFrame(rafRef.current);
                    clearInterval(speedInterval);
                    clearTimeout(resizeTimer);
                    window.removeEventListener('resize', resize);
                    window.removeEventListener('mousemove', onMouseMove);
                };
            }, []);

            React.useEffect(() => {
                rebuildRef.current?.();
            }, [dotRadius, dotSpacing, isDarkMode]);

            return (
                <div className="absolute inset-0 w-full h-full pointer-events-none overflow-hidden" {...rest}>

                    name: user.name, 
                    empNo: user.empNo,
                    startDate: sDate,
                    startTimePart: '09:00', // 업무 시작 기본 시간
                    endDate: eDate,
                    endTimePart: '12:00',   // 기본 오전 대여 추천
                    purpose: '', 
                    details: ''
                });
                setShowForm(true);
            };

            const isAvailableDate = (dateStr) => {
                if (!dateStr) return false;
                const date = new Date(dateStr + "T00:00:00");
                const day = date.getDay();

                if (day === 0 || day === 6) return false;
                if (typeof getHolidayName === 'function' && getHolidayName(date)) return false;

                return true;
            };

            // ⚡ 시작일 변경 시 반납일 자동 동기화
            const handleStartDateChange = (newStartDate) => {
                setFormData(prev => {
                    const shouldSyncEnd = !prev.endDate || prev.endDate < newStartDate;
                    return {
                        ...prev,
                        startDate: newStartDate,
                        endDate: shouldSyncEnd ? newStartDate : prev.endDate
                    };
                });
            };

            // ⚡ 시작시간 변경 시 반납시간 스마트 추천 (자동 입력)
            const handleStartTimeChange = (newStartTime) => {
                setFormData(prev => {
                    let updatedEndTime = prev.endTimePart;
                    if (!prev.endTimePart || (prev.startDate === prev.endDate && prev.endTimePart <= newStartTime)) {
                        // 2시간 뒤 또는 당일 17:30 자동 설정
                        const [h, m] = newStartTime.split(':').map(Number);
                        const endHour = Math.min(h + 2, 17);
                        const endStr = `${String(endHour).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                        updatedEndTime = TIME_OPTIONS.includes(endStr) ? endStr : '17:30';
                    }
                    return {
                        ...prev,
                        startTimePart: newStartTime,
                        endTimePart: updatedEndTime
                    };
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                const finalDept = deptSelect === '직접 입력' ? String(deptCustom || "").trim() : deptSelect;
                const finalBudget = budgetSelect === '기타' ? String(budgetCustom || "").trim() : budgetSelect;
                const finalPhone1 = phone1Select === '기타' ? String(phone1Custom || "").trim() : phone1Select;

                if (deptSelect === '선택') return alert("대여 부서를 선택해주세요.");
                if (budgetSelect === '선택') return alert("사용 예산 구분을 선택해주세요.");
                if (!formData.startDate || !formData.startTimePart || !formData.endDate || !formData.endTimePart) {
                    return alert("대여/반납 예정일 및 시간을 모두 선택해주세요.");
                }
                if (!user.isAdmin) {
                
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                
                    const maxBookingDate = new Date();
                    maxBookingDate.setHours(23, 59, 59, 999);
                    maxBookingDate.setMonth(maxBookingDate.getMonth() + 2);
                
                    const startDateOnly = new Date(`${formData.startDate}T00:00:00`);
                    const endDateOnly = new Date(`${formData.endDate}T00:00:00`);
                
                    if (startDateOnly < today) {
                        return alert("지난 날짜는 예약할 수 없습니다.");
                    }
                    if (endDateOnly < today) {
                        return alert("지난 날짜는 반납일로 선택할 수 없습니다.");
                    }
                    if (startDateOnly > maxBookingDate || endDateOnly > maxBookingDate) {
                        return alert("예약은 신청일 기준 2개월 이내에서만 가능합니다.");
                    }
                }

                if (!isAvailableDate(formData.startDate)) return alert("대여 시작일은 주말 및 공휴일을 제외한 평일만 선택 가능합니다.");

                const combinedContact = `${finalPhone1}-${phone2.trim()}-${phone3.trim()}`;

                const newStart = new Date(`${formData.startDate}T${formData.startTimePart}:00`);
                const newEnd = new Date(`${formData.endDate}T${formData.endTimePart}:00`);

                if (newStart >= newEnd) {
                    alert("반납 예정시간은 대여 시작시간보다 나중이어야 합니다.");
                    return;
                }

                let validDaysCount = 0;
                let tempDate = new Date(`${formData.startDate}T00:00:00`);
                const endDateLimit = new Date(`${formData.endDate}T00:00:00`);

                while (tempDate <= endDateLimit) {
                    const yyyy = tempDate.getFullYear();
                    const mm = String(tempDate.getMonth() + 1).padStart(2, '0');
                    const dd = String(tempDate.getDate()).padStart(2, '0');
                    const dateStr = `${yyyy}-${mm}-${dd}`;

                    if (isAvailableDate(dateStr)) {
                        validDaysCount++;
                    }
    
                    tempDate.setDate(tempDate.getDate() + 1);
                }

                if (!user.isAdmin && validDaysCount > 3) {
                    alert("원활한 카드 사용을 위해 장기 예약은 최대 3일(영업일 기준)까지만 가능합니다.");
                    return;
                }

                const isOverlap = events.some(ev => {
                    if (formData.id && String(ev.id) === String(formData.id)) return false;
                    const evStart = new Date(ev.start).getTime();
                    const evEnd = new Date(ev.end).getTime();
                    const reqStart = newStart.getTime();
                    const reqEnd = newEnd.getTime();
                    return (reqStart < evEnd) && (reqEnd > evStart);
                });

                if (isOverlap) {
                    alert("선택하신 시간에 이미 예약된 내역이 있습니다.");
                    return;

                    const result = await callApi({ action: actionType, token: user.token, ...payload });
                    setLoading(false); setShowForm(false); calendarInstanceRef.current?.unselect();
                    const tempId = formData.id || result.id || "temp-" + Date.now(), budgetColor = payload.budget === '간호부' ? '#3b82f6' : payload.budget === '총무팀' ? '#10b981' : payload.budget === 'QI(적정진료관리팀)' ? '#f59e0b' : payload.budget === '학생실습비' ? '#8b5cf6' : '#64748b';
                    const newEvent = { id: tempId, title: `[${payload.dept}] ${user.name}`, start: payload.startTime, end: payload.endTime, extendedProps: { id: tempId, dept: payload.dept, name: user.name, startTime: payload.startTime, endTime: payload.endTime, budget: payload.budget, purpose: payload.purpose, isMine: true, canEdit: true, canViewContact: true, contactMasked: payload.contact.replace(/^(\d{2,3})-\d{3,4}-(\d{4})$/, '$1-****-$2'), colorCode: budgetColor }, backgroundColor: 'transparent', borderColor: 'transparent' };

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">세부 내용 (선택사항)</label>
                                        <textarea disabled={!hasPermission} value={formData.details} onChange={e => setFormData({ ...formData, details: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm h-16 focus:outline-none focus:border-blue-600 dark:focus:border-blue-500 disabled:bg-slate-50 dark:disabled:bg-slate-800/50 dark:disabled:text-slate-500 transition-colors" placeholder="필요시 기입"></textarea>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">연락처 (휴대폰 번호)</label>
                                        {hasPermission ? (
                                            <>
                                                <div className="flex items-center space-x-2">
                                                    <select value={phone1Select} onChange={e => setPhone1Select(e.target.value)} className="w-24 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-blue-600 dark:focus:border-blue-500">
                                                        <option value="010">010</option><option value="011">011</option><option value="016">016</option><option value="기타">직접 입력</option>
                                                    </select>
                                                    <span className="text-slate-400 dark:text-slate-500">-</span>
                                                    <input type="text" required maxLength="4" value={phone2} onChange={e => setPhone2(e.target.value.replace(/[^0-9]/g, ''))} className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm text-center focus:outline-none focus:border-blue-600" />
                                                    <span className="text-slate-400 dark:text-slate-500">-</span>
                                                    <input type="text" required maxLength="4" value={phone3} onChange={e => setPhone3(e.target.value.replace(/[^0-9]/g, ''))} className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm text-center focus:outline-none focus:border-blue-600" />
                                                </div>
                                                {phone1Select === '기타' && <input type="text" required maxLength="4" value={phone1Custom} onChange={e => setPhone1Custom(e.target.value.replace(/[^0-9]/g, ''))} className="w-24 mt-2 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white text-sm text-center" placeholder="번호 입력" />}
                                            </>
                                        ) : (
                                            <div className="rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/50 p-3">
                                                <div className="flex items-center justify-between gap-3">
                                                    <div>
                                                        <div className="text-sm font-semibold text-slate-700 dark:text-slate-200">{selectedEvent?.contactRevealed ? selectedEvent.contact : selectedEvent?.contactMasked || '연락처 비공개'}</div>
                                                        {!selectedEvent?.contactRevealed && <div className="text-[11px] text-slate-400 mt-1">필요한 경우에만 연락처를 확인해 주세요.</div>}
                                                    </div>
                                                    {!selectedEvent?.contactRevealed && <button type="button" onClick={async () => { setLoading(true); try { const data = await callApi({ action: 'GET_CONTACT', token: user.token, id: selectedEvent.id }); setSelectedEvent(prev => ({ ...prev, contact: data.contact, contactRevealed: true })); showToast('연락처가 표시되었습니다.'); } catch (e) { alert(e.message); } finally { setLoading(false); } }} className="shrink-0 px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold transition">연락처 보기</button>}
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex flex-wrap gap-2 pt-4 border-t border-slate-100 dark:border-slate-700 mt-4">
                                        {formData.id && hasPermission && (
                                            <button type="button" onClick={handleDelete} className="flex-1 sm:flex-none whitespace-nowrap bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 font-medium px-3 py-2.5 rounded-xl text-xs sm:text-sm transition">
                                                예약 취소
                                            </button>
                                        )}
                                        <div className="flex-1 flex gap-2 justify-end w-full sm:w-auto">

                                            {user.isAdmin && (
                                                <button
                                                    type="button"
                                                    onClick={async () => {
                                                        const isHoliday = !!customHolidays[selectedSlot.startDate];
                                                        const name = isHoliday ? "" : "임시공휴일";
                                                        setLoading(true);
                                                        try {
                                                            await callApi({ action: "TOGGLE_HOLIDAY", token: user.token, date: selectedSlot.startDate, name });

                                                            setTimeout(async () => {
                                                                await fetchBookings();
                                                                calendarInstanceRef.current?.render();
                                                                setLoading(false);
                                                                alert(isHoliday ? "공휴일이 해제되었습니다." : "공휴일로 지정되었습니다.");
                                                            }, 1500);

                                                            setShowForm(false);
                                                        } catch (e) {
                                                            alert("오류가 발생했습니다.");
                                                            setLoading(false);
                                                        }
                                                    }}
                                                    className={`flex-1 sm:flex-none whitespace-nowrap px-3 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${!!customHolidays[selectedSlot.startDate]
                                                            ? "bg-amber-600 hover:bg-amber-700 text-white"
                                                            : "bg-purple-600 hover:bg-purple-700 text-white"
                                                        }`}
                                                >
                                                    {customHolidays[selectedSlot.startDate] ? "공휴일 해제" : "공휴일 지정"}
                                                </button>
                                            )}
                                            
                                            <button type="button" onClick={() => {
                                                setShowForm(false);
                                                calendarInstanceRef.current?.unselect();
                                            }} className="flex-1 sm:flex-none whitespace-nowrap px-3 py-2.5 rounded-xl text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                                                취소
                                            </button>
                                            
                                            {hasPermission && (
                                                <button
                                                    type="submit"
                                                    disabled={loading}
                                                    className={`flex-1 sm:flex-none whitespace-nowrap px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${loading ? 'bg-gray-400 dark:bg-slate-600 cursor-not-allowed text-white' : 'bg-blue-700 text-white hover:bg-blue-800 dark:hover:bg-blue-600'}`}
                                                >
                                                    {loading ? '저장 중...' : '저장'}
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showInstruction && (
                        <div 
                            className="fixed inset-0 bg-black/40 dark:bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-[9999]" onClick={() => setShowInstruction(false)}>
                            <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full shadow-2xl p-6 border border-slate-100 dark:border-slate-700" onClick={(e) => e.stopPropagation()}>
                                <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-4">법인카드 예약 시스템 이용 안내</h3>
                                <div className="bg-slate-50 dark:bg-slate-900 rounded-xl p-4 text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-6 space-y-4 max-h-[60vh] overflow-y-auto">
                                    <div>
                                        <p className="font-bold text-blue-600 dark:text-blue-400 mb-1">[예약 및 이용]</p>
                                        <p className="pl-2">• 캘린더 해당 날짜의 빈 공간 클릭하여 예약 신청</p>
                                        <p className="pl-2">• 기존 예약과 미중복 시 추가 예약 가능</p>
                                        <p className="pl-2">• 대여 및 반납: 평일 08:30 ~ 17:30</p>
                                    </div>
                                    
                                    <div>
                                        <p className="font-bold text-red-600 dark:text-red-400 mb-1">[예약 제한]</p>
                                        <p className="pl-2">• 예약 가능 기한: 신청일 기준 2개월 이내</p>
                                        <p className="pl-2">• 주말 및 공휴일 예약 불가</p>
                                        <p className="pl-2">• 최대 대여: 평일 기준 3일 (장기 대여 사전 문의)</p>
                                    </div>

                                    <div>
                                        <p className="font-bold text-emerald-600 dark:text-emerald-400 mb-1">[수정 및 취소]</p>
                                        <p className="pl-2">• 본인 예약 내역 클릭 시 수정 가능</p>
                                        <p className="pl-2">• 본인 예약 건에 한하여 취소 가능</p>
                                    </div>
                                </div>

                                <button onClick={() => setShowInstruction(false)} className="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-3 rounded-xl transition text-sm shadow-md">
                                    안내사항을 확인했습니다
                                </button>
                            </div>
                        </div>
                    )}

                    {toast && (<div className="fixed bottom-20 sm:bottom-6 right-4 sm:right-6 z-[99999]">
                            <div className={`flex items-center gap-2 px-4 py-3 rounded-xl shadow-xl border text-sm font-semibold ${ toast.type === 'error'
                                        ? 'bg-red-600 border-red-500 text-white'
                                        : toast.type === 'warning'
                                        ? 'bg-amber-500 border-amber-400 text-white'
                                        : 'bg-slate-900 dark:bg-white border-slate-800 dark:border-white text-white dark:text-slate-900'
                                }`}
                            >
                                <span>
                                    {toast.type === 'error'
                                        ? '✕'
                                        : toast.type === 'warning'
                                        ? '!'
                                        : '✓'
                                    }
                                </span>
                    
                                {toast.message}
                            </div>
                    
                        </div>
                    )}

                    {/* 모바일 하단 네비게이션 (Safe-Area 대응) */}
                    <div className="sm:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-800/95 backdrop-blur border-t border-slate-200 dark:border-slate-700 px-3 pt-2 pb-[max(0.5rem,env(safe-area-inset-bottom))]">
                        <div className="grid grid-cols-3 gap-1">
                            <button
                                onClick={() => {
                                    if (!calendarInstanceRef.current) return;
                                    calendarInstanceRef.current.changeView('dayGridMonth');
                                }}
                                className="flex flex-col items-center justify-center gap-1 py-1 text-slate-500 dark:text-slate-300"
                            >
                                <svg
                                    className="w-5 h-5"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    strokeWidth="2"
                                >
                                    <rect x="3" y="4" width="18" height="17" rx="2"/>
                                    <path d="M8 2v4M16 2v4M3 10h18"/>
                                </svg>
                                <span className="text-[10px] font-medium">
                                    달력
                                </span>
                            </button>
                    
                            <button
                                onClick={() => {
                                    if (!calendarInstanceRef.current) return;
                                    calendarInstanceRef.current.today();
                                    calendarInstanceRef.current.changeView('timeGridDay');
                                }}
                                className="flex flex-col items-center justify-center gap-1 py-1 text-blue-600 dark:text-blue-400"
                            >
                                <div className="w-5 h-5 rounded-md bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center text-[10px] font-bold">
                                    {currentTime.getDate()}
                                </div>
                                <span className="text-[10px] font-semibold">
                                    오늘
                                </span>
                            </button>
                    
                            <button
                                onClick={() => setShowMyBookings(true)}
                                className="relative flex flex-col items-center justify-center gap-1 py-1 text-slate-500 dark:text-slate-300"
                            >
                                <svg
                                    className="w-5 h-5"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    strokeWidth="2"
                                >
                                    <path d="M8 7V3m8 4V3"/>
                                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                                    <path d="M3 11h18"/>
                                </svg>
                    
                                {myBookings.length > 0 && (
                                    <span className="absolute top-0 right-[28%] min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[9px] flex items-center justify-center">
                                        {myBookings.length}
                                    </span>
                                )}
                                <span className="text-[10px] font-medium">
                                    내 예약
                                </span>
                            </button>
                        </div>
                    </div>
                    <div className="fixed bottom-14 sm:bottom-4 right-3 sm:right-4 z-[40] text-right pointer-events-none opacity-80 select-none">
                        <p className="text-[10px] font-medium text-slate-400 dark:text-slate-500">
                            &copy; vico.yj All rights reserved. <span className="mx-1 text-slate-300 dark:text-slate-600">|</span> codeyj@duck.com
                        </p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
