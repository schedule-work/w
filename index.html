<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DNS &gt; 임상지원 근무표</title>
    <link rel="icon" type="image/png" href="IMG_385.png?v=2">

    <style>
        :root {
            --bg: #fbfaf7;
            --soft: #f1eee8;
            --ink: #24211d;
            --muted: #817a70;
            --line: #e5dfd5;
            --accent: #b84d32;
            --accent-soft: #f7e8e1;
            --shadow: 0 1px 2px rgba(25,31,40,0.04), 0 10px 28px rgba(25,31,40,0.06);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 20px;
            --grid: #d8d1c6;
        }

        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-variant-numeric: tabular-nums;
            background-color: var(--bg);
            color: var(--ink);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hairline { border-color: var(--line); }
        .hidden { display: none !important; }
        .shrink-0 { flex-shrink: 0; }
        .flex-1 { flex: 1 1 0%; }
        .w-full { width: 100%; }
        .relative { position: relative; }
        .z-0 { z-index: 0; }
        .min-h-0 { min-height: 0; }
        .text-red-500 { color: #b42318; }
        .text-xs { font-size: 0.75rem; }
        .p-4 { padding: 1rem; }
        .font-medium { font-weight: 500; }

        /* ---------- topbar ---------- */
        .topbar {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 22px 28px 14px;
            background: var(--bg);
        }
        .wordmark { font-family: Georgia, serif; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
        .brand-sub { font-size: 0.7rem; color: var(--muted); font-weight: 500; }

        /* ---------- group tabs: prominent, can't-miss segmented control ---------- */
        .tabs-row {
            display: flex;
            gap: 10px;
            padding: 0 28px 16px;
            border-bottom: 1px solid var(--line);
            background: var(--bg);
        }
        .tab {
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--muted);
            background: var(--soft);
            padding: 11px 24px;
            border-radius: 4px;
            border: none;
            transition: color 0.15s ease, background-color 0.15s ease;
        }
        .tab[data-active="true"] { color: #fff; background: var(--ink); }
        .tab[data-active="false"]:hover { background: #eceef1; color: var(--ink); }

        /* ---------- search ---------- */
        .search-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 28px 12px;
            background: var(--bg);
        }
        .search-box { position: relative; flex: 0 0 420px; max-width: 70vw; }
        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            background: var(--soft);
            border-radius: 3px;
            padding: 12px 40px 12px 14px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--ink);
        }
        .search-box input::placeholder { color: var(--muted); font-weight: 500; }
        .search-box input:focus { box-shadow: 0 0 0 3px var(--accent-soft); }
        .search-clear {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            font-size: 0.75rem; color: var(--muted); cursor: pointer;
        }
        .search-clear:hover { color: var(--ink); }
        .search-status { font-size: 0.7rem; color: var(--muted); }

        .search-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: var(--bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            border: 1px solid var(--line);
            max-height: 320px;
            overflow-y: auto;
            z-index: 30;
        }
        .search-dropdown-item { padding: 10px 16px; cursor: pointer; }
        .search-dropdown-item:hover { background: var(--soft); }
        .search-dropdown-item .n { font-size: 0.85rem; font-weight: 700; color: var(--ink); }
        .search-dropdown-item .n .k { color: var(--muted); font-weight: 600; margin-left: 6px; }
        .search-dropdown-item .m { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
        .search-dropdown-empty { padding: 16px; font-size: 0.8rem; color: var(--muted); text-align: center; }

        /* ---------- sheet chips ---------- */
        .chips-wrap { padding: 0 28px 14px; }
        .chips {
            display: flex; gap: 8px; overflow-x: auto;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex-shrink: 0; white-space: nowrap;
            font-size: 0.8rem; font-weight: 700;
            padding: 8px 14px; border-radius: 3px;
            background: var(--soft); color: var(--muted);
        }
        .chip[data-active="true"] { background: var(--ink); color: #fff; }
        .chip[data-active="false"]:hover { background: #eceef1; }

        /* ---------- main area ---------- */
        .main-area { padding: 12px 28px 24px; display: flex; flex-direction: column; }
        #sheet-container { flex: 1; min-height: 0; display: flex; flex-direction: column; }

        .loading-overlay {
            position: absolute; inset: 0; z-index: 20;
            display: flex; align-items: center; justify-content: center;
            background: rgba(251,250,247,0.9); backdrop-filter: blur(2px);
        }
        .loading-text { font-family: Georgia, serif; font-weight: 700; font-size: 1rem; color: var(--accent); letter-spacing: 0.02em; }

        /* ---------- table rendering ---------- */
        .table-scroll {
            flex: 1;
            min-height: 0;
            overflow: auto;
            border-radius: 12px;
            border: 1px solid var(--grid);
            box-shadow: 0 1px 0 rgba(36,33,29,0.04);
            background: var(--bg);
        }
        .sheet-table { border-collapse: separate; border-spacing: 0; }
        .sheet-table th, .sheet-table td {
            border: 1px solid var(--grid);
            padding: 6px 10px;
            font-size: 12px;
            text-align: center;
            box-sizing: border-box;
        }
        .freeze-row {
            position: sticky;
            height: 36px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: var(--bg);
        }
        .freeze-col {
            position: sticky;
            width: 84px;
            min-width: 84px;
            max-width: 84px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: var(--bg);
        }
        .calendar-block .freeze-col { width: 168px; min-width: 168px; max-width: 168px; }

        .calendar-blocks {
            flex: 1;
            min-height: 0;
            display: flex;
            gap: 16px;
            overflow: auto;
            padding: 4px;
        }
        .calendar-block { display: flex; flex-direction: column; flex: 0 0 auto; max-width: 90vw; }
        .calendar-block .table-scroll { flex: 1; min-height: 0; }
        .calendar-block-title { font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: var(--ink); }

        /* ---------- search jump-and-highlight ---------- */
        tr.search-highlight td, tr.search-highlight th { box-shadow: inset 0 0 0 2px var(--accent); }
        td.search-highlight { box-shadow: inset 0 0 0 2px var(--accent); }
        .search-highlight-cell { box-shadow: inset 0 0 0 3px var(--accent) !important; }

        /* ---------- footer ---------- */
        .footer {
            padding: 10px 28px;
            font-size: 0.68rem;
            letter-spacing: 0.04em;
            color: var(--muted);
            text-align: center;
            border-top: 1px solid var(--line);
            background: var(--bg);
        }
    </style>
</head>
<body>

    <header class="topbar shrink-0">
        <span class="wordmark">Shift Schedule</span>
        <span class="brand-sub">DNS &middot; Korea University Guro Hospital</span>
    </header>

    <nav class="tabs-row shrink-0">
        <button id="btn-group1" class="tab" data-active="false" onclick="toggleGroup('group1', this)">진료지원</button>
        <button id="btn-group2" class="tab" data-active="false" onclick="toggleGroup('group2', this)">전담간호사</button>
    </nav>

    <div class="search-wrap shrink-0">
        <div class="search-box">
            <input id="search-input" type="text" placeholder="이름 또는 사번으로 검색" autocomplete="off">
            <span id="search-clear" class="search-clear hidden">&#10005;</span>
            <div id="search-dropdown" class="search-dropdown hidden"></div>
        </div>
        <span id="search-status" class="search-status"></span>
    </div>

    <div class="chips-wrap shrink-0">
        <div id="group1-sub" class="chips hidden"></div>
        <div id="group2-sub" class="chips hidden"></div>
    </div>

    <main class="flex-1 w-full relative z-0 main-area min-h-0">
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-text animate-pulse">Loading...</div>
        </div>

        <div id="sheet-container"></div>
    </main>

    <footer class="footer shrink-0">
        DNS Shift Schedule &middot; Korea University Guro Hospital
    </footer>

    <script>
    /* ============================== CONFIG ============================== */
    const GROUPS = {
        group1: {
            name: "진료지원",
            api: "https://script.google.com/macros/s/AKfycbz_FRqb7fbZwxNg_eWIXjDL15tW8iZGllcs7y6-qzZev7YtFHgRNJUSgm9n7352AZXJYw/exec"
        },
        group2: {
            name: "전담간호사",
            api: "https://script.google.com/macros/s/AKfycbzBpLXtYgjmbzRp74KMrdb2_tZTJYkAQn_aMRQ2AQau3IoofRKA42tzEKpOGn4Hhftmew/exec"
        }
    };

    // 알려진 9개 탭의 형태(shape). 새 탭이 생기면 detectShape()의 휴리스틱으로 폴백.
    const SHEET_SHAPE = {
        740884234: 'A',   // 진료지원 (2608)
        33060022: 'A',    // 진료지원 (2609)
        341912263: 'C',   // NS 담당 진료지원 간호사 및 Spine 보조기 업체
        0: 'A',           // 채혈전담
        882148533: 'A2',  // 프로시저팀
        302779154: 'B',   // 드레싱 전담
        2012649705: 'A',  // 중증외상최종치료센터
        948328916: 'A2',  // 통합항암 전담
        1970097519: 'C'   // NS 수술전담 - 토요일
    };

    const ROW_HEIGHT = 36;
    const COL_WIDTH = 84;

    /* ============================== STATE/CACHE ============================== */
    const sheetCache = new Map();     // "group:gid" -> payload
    const sheetListCache = new Map(); // group -> Promise<sheet[]>
    const groupAllCache = new Map();  // group -> Promise<payload[]>
    const searchIndex = [];           // PersonRecord[]
    const searchIndexReady = { group1: false, group2: false };
    let currentGroup = null, currentGid = null;
    let loadSequence = 0;

    /* ============================== API LAYER ============================== */
    async function fetchSingleSheet(group, gid) {
        const key = `${group}:${gid}`;
        if (sheetCache.has(key)) return sheetCache.get(key);
        const res = await fetch(`${GROUPS[group].api}?sheet=${gid}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`시트 요청 실패: ${res.status}`);
        const payload = await res.json();
        sheetCache.set(key, payload);
        return payload;
    }

    function fetchSheetList(group) {
        if (!sheetListCache.has(group)) {
            const promise = fetch(GROUPS[group].api, { cache: 'no-store' })
                .then(res => { if (!res.ok) throw new Error(`시트 목록 요청 실패: ${res.status}`); return res.json(); })
                .catch(err => { sheetListCache.delete(group); throw err; });
            sheetListCache.set(group, promise);
        }
        return sheetListCache.get(group);
    }

    function ensureGroupIndexed(group) {
        if (!groupAllCache.has(group)) {
            const promise = fetch(`${GROUPS[group].api}?all=1`, { cache: 'no-store' })
                .then(res => { if (!res.ok) throw new Error(`검색 데이터 요청 실패: ${res.status}`); return res; })
                .then(res => res.json())
                .then(list => {
                    // 검색용 축약 payload는 정식 시트 payload 캐시에 섞지 않는다.
                    // 섞이면 이후 화면 렌더링에서 폰트/테두리/정렬 서식이 사라진다.
                    list.forEach(payload => indexSheet(group, payload));
                    searchIndexReady[group] = true;
                    updateSearchStatus();
                    return list;
                })
                .catch(err => {
                    console.error(`검색 인덱스 로드 실패 (${group})`, err);
                    groupAllCache.delete(group);
                });
            groupAllCache.set(group, promise);
        }
        return groupAllCache.get(group);
    }

    /* ============================== PARSING / SHAPE DETECTION ============================== */
    function detectShape(payload) {
        if (SHEET_SHAPE[payload.gid]) return SHEET_SHAPE[payload.gid];
        const flat = payload.values.flat();
        if (flat.some(v => /^\d{1,2}월\d{1,2}일$/.test(v))) return 'B';
        const idHeaderHits = payload.values.filter(row => /^(근무자|사번|이름)$/.test((row[0] || '').trim())).length;
        return idHeaderHits > 1 ? 'A2' : 'A';
    }

    function buildMergeMap(merges) {
        const mergeStart = new Map();
        const mergedAway = new Set();
        (merges || []).forEach(m => {
            mergeStart.set(`${m.row},${m.col}`, m);
            for (let r = m.row; r < m.row + m.numRows; r++) {
                for (let c = m.col; c < m.col + m.numCols; c++) {
                    if (r === m.row && c === m.col) continue;
                    mergedAway.add(`${r},${c}`);
                }
            }
        });
        return { mergeStart, mergedAway };
    }

    function stripParen(s) { return String(s || '').replace(/\(.+?\)/g, '').trim(); }

    function parseDateToken(token, state) {
        const t = stripParen(token);
        let m;
        if ((m = t.match(/^(\d{1,2})월(\d{1,2})일$/))) return finalizeDate(+m[1], +m[2], state);
        if ((m = t.match(/^(\d{1,2})\/(\d{1,2})$/))) return finalizeDate(+m[1], +m[2], state);
        if ((m = t.match(/^(\d{1,2})$/)) && state.lastMonth != null) return finalizeDate(state.lastMonth, +m[1], state);
        return null;
    }

    function finalizeDate(month, day, state) {
        if (state.lastMonth != null && month < state.lastMonth - 1) {
            state.yearOffset = (state.yearOffset || 0) + 1;
        }
        state.lastMonth = month;
        const year = state.baseYear + (state.yearOffset || 0);
        return new Date(year, month - 1, day);
    }

    function newDateState() {
        return { lastMonth: null, yearOffset: 0, baseYear: new Date().getFullYear() };
    }

    function findBestHeaderRow(values, maxScan) {
        maxScan = Math.min(maxScan || 5, values.length);
        let best = { idx: 0, count: -1 };
        for (let r = 0; r < maxScan; r++) {
            const state = newDateState();
            let count = 0;
            values[r].forEach(cell => { if (parseDateToken(cell, state)) count++; });
            if (count > best.count) best = { idx: r, count };
        }
        return best.idx;
    }

    function findHeaderInfo(values, headerRowIdx) {
        const headerRow = values[headerRowIdx];
        const dateCols = [];
        const state = newDateState();
        headerRow.forEach((cell, c) => {
            const d = parseDateToken(cell, state);
            if (d) dateCols.push({ col: c, date: d });
        });
        const firstDateCol = dateCols.length ? dateCols[0].col : headerRow.length;
        return { dateCols, firstDateCol };
    }

    function findLabeledCol(headerRow, idColsEnd, regex) {
        for (let c = 0; c < idColsEnd; c++) {
            if (regex.test((headerRow[c] || '').trim())) return c;
        }
        return -1;
    }

    function entryFromCell(payload, r, c, date, raw) {
        return {
            date,
            raw: raw !== undefined ? raw : (payload.values[r][c] || ''),
            bg: payload.backgrounds[r][c],
            color: payload.fontColors[r][c],
            bold: payload.fontWeights[r][c] === 'bold'
        };
    }

    function parseShapeA(payload, group) {
        const { values } = payload;
        const headerRowIdx = findBestHeaderRow(values, 5);
        const { dateCols, firstDateCol } = findHeaderInfo(values, headerRowIdx);
        if (!dateCols.length) return [];
        const headerRow = values[headerRowIdx];
        const idKeyCol = findLabeledCol(headerRow, firstDateCol, /사번/);
        const idNameCol = findLabeledCol(headerRow, firstDateCol, /이름|근무자/);
        const records = [];
        for (let r = headerRowIdx + 1; r < values.length; r++) {
            const row = values[r];
            const name = idNameCol >= 0 ? (row[idNameCol] || '').trim() : '';
            const key = idKeyCol >= 0 ? (row[idKeyCol] || '').trim() : '';
            if (!name && !key) continue;
            const entries = dateCols.map(({ col, date }) => entryFromCell(payload, r, col, date));
            records.push({ personKey: key || name, personName: name || key, group, sheetName: payload.name, gid: payload.gid, entries });
        }
        return records;
    }

    function findBlockHeaders(values) {
        const idxs = [];
        values.forEach((row, r) => {
            const c0 = (row[0] || '').trim();
            if (!/^(근무자|사번|이름)$/.test(c0)) return;
            const hasDate = row.some((cell, c) => c > 0 && /^\d{1,2}\s*\/\s*\d{1,2}|^\d{1,2}월\d{1,2}일/.test(String(cell || '').trim()));
            if (hasDate) idxs.push(r);
        });
        return idxs;
    }

    function parseShapeA2(payload, group) {
        const { values } = payload;
        const blockHeaderIdxs = findBlockHeaders(values);
        const records = [];
        blockHeaderIdxs.forEach((headerRowIdx, i) => {
            const endRow = i + 1 < blockHeaderIdxs.length ? blockHeaderIdxs[i + 1] : values.length;
            const { dateCols, firstDateCol } = findHeaderInfo(values, headerRowIdx);
            if (!dateCols.length) return;
            const headerRow = values[headerRowIdx];
            const idKeyCol = findLabeledCol(headerRow, firstDateCol, /사번/);
            const idNameCol = findLabeledCol(headerRow, firstDateCol, /이름|근무자/);
            for (let r = headerRowIdx + 1; r < endRow; r++) {
                const row = values[r];
                const name = idNameCol >= 0 ? (row[idNameCol] || '').trim() : '';
                const key = idKeyCol >= 0 ? (row[idKeyCol] || '').trim() : '';
                if (!name && !key) continue;
                const entries = dateCols.map(({ col, date }) => entryFromCell(payload, r, col, date));
                records.push({ personKey: key || name, personName: name || key, group, sheetName: payload.name, gid: payload.gid, entries });
            }
        });
        return records;
    }

    function findCalendarBlocks(values, merges) {
        return (merges || [])
            .filter(m => m.row === 0)
            .map(m => ({ title: values[0][m.col], startCol: m.col, width: m.numCols }));
    }

    function findBlockHeaderRows(values, block) {
        let dowRow = -1, dateRow = -1;
        const scanMax = Math.min(8, values.length);
        for (let r = 0; r < scanMax; r++) {
            const slice = values[r].slice(block.startCol, block.startCol + block.width);
            if (dowRow === -1 && slice.some(v => /^(월|화|수|목|금|토|일)$/.test((v || '').trim()))) dowRow = r;
            if (dowRow !== -1 && r > dowRow && slice.some(v => /^\d{1,2}월\d{1,2}일$/.test((v || '').trim()))) { dateRow = r; break; }
        }
        return { dowRow, dateRow };
    }

    function parseShapeB(payload, group) {
        const { values, merges } = payload;
        const blocks = findCalendarBlocks(values, merges);
        const records = new Map();
        blocks.forEach(block => {
            const { dowRow, dateRow } = findBlockHeaderRows(values, block);
            if (dowRow === -1 || dateRow === -1) return;
            const dayCols = [];
            for (let c = block.startCol; c < block.startCol + block.width; c++) {
                const dow = (values[dowRow][c] || '').trim();
                const dateTok = (values[dateRow][c] || '').trim();
                const m = dateTok.match(/^(\d{1,2})월(\d{1,2})일$/);
                if (/^(월|화|수|목|금|토|일)$/.test(dow) && m) {
                    dayCols.push({ col: c, date: new Date(new Date().getFullYear(), +m[1] - 1, +m[2]) });
                }
            }
            if (!dayCols.length) return;
            const roomCol = block.startCol;
            for (let r = dateRow + 1; r < values.length; r++) {
                const roomLabel = (values[r][roomCol] || '').trim();
                if (!roomLabel) continue;
                dayCols.forEach(({ col, date }) => {
                    const name = (values[r][col] || '').trim();
                    if (!name) return;
                    if (!records.has(name)) {
                        records.set(name, { personKey: name, personName: name, group, sheetName: payload.name, gid: payload.gid, entries: [] });
                    }
                    records.get(name).entries.push(entryFromCell(payload, r, col, date, `${roomLabel} 담당`));
                });
            }
        });
        return Array.from(records.values());
    }

    function indexSheet(group, payload) {
        const shape = detectShape(payload);
        if (shape === 'C') return;
        let records = [];
        if (shape === 'A') records = parseShapeA(payload, group);
        else if (shape === 'A2') records = parseShapeA2(payload, group);
        else if (shape === 'B') records = parseShapeB(payload, group);
        searchIndex.push(...records);
    }

    /* ============================== RENDERING ============================== */
    function borderCssFor(payload, r, c) {
        const b = payload.borders && payload.borders[r] && payload.borders[r][c];
        if (!b) return '';
        let s = '';
        ['top', 'bottom', 'left', 'right'].forEach(side => {
            const v = b[side];
            if (v) s += `border-${side}:${v.width}px ${v.style} ${v.color};`;
        });
        return s;
    }

    function cellStyleAttr(payload, r, c, opts) {
        opts = opts || {};
        const bg = payload.backgrounds[r][c];
        const color = payload.fontColors[r][c];
        const bold = payload.fontWeights[r][c] === 'bold';
        const italic = payload.fontStyles && payload.fontStyles[r][c] === 'italic';
        const family = payload.fontFamilies && payload.fontFamilies[r][c];
        const size = payload.fontSizes && payload.fontSizes[r][c];
        const align = payload.horizontalAlignments && payload.horizontalAlignments[r][c];
        let style = '';
        if (bg) style += `background-color:${bg};`;
        if (color) style += `color:${color};`;
        if (bold) style += `font-weight:700;`;
        if (italic) style += `font-style:italic;`;
        if (family) style += `font-family:'${family}',sans-serif;`;
        if (size) style += `font-size:${size}px;`;
        if (align) style += `text-align:${String(align).toLowerCase()};`;
        if (!opts.skipWrap) {
            const wrap = payload.wraps && payload.wraps[r][c];
            style += wrap ? 'white-space:normal;' : 'white-space:nowrap;';
        }
        style += borderCssFor(payload, r, c);
        return style;
    }

    function cumulativeOffsets(widths, fallback) {
        const offsets = [0];
        (widths || []).forEach(value => offsets.push(offsets[offsets.length - 1] + (Number(value) || fallback)));
        return offsets;
    }

    function addColumnWidths(table, widths) {
        if (!widths || !widths.length) return;
        const colgroup = document.createElement('colgroup');
        widths.forEach(width => {
            const col = document.createElement('col');
            col.style.width = `${width}px`;
            colgroup.appendChild(col);
        });
        table.appendChild(colgroup);
    }

    function renderGenericTable(container, payload) {
        const { values, merges, frozenRows, frozenColumns, gid } = payload;
        const { mergeStart, mergedAway } = buildMergeMap(merges);
        const isIrregular = SHEET_SHAPE[gid] === 'C';
        const freezeRows = frozenRows || (isIrregular ? 0 : 1);
        const freezeCols = frozenColumns || (isIrregular ? 0 : 2);

        // 검색 이동 시 행/셀을 찾아 하이라이트하기 위한 사람열/날짜열 태깅 (표 아닌 시트는 생략)
        let dateColMap = new Map();
        let idKeyCol = -1, idNameCol = -1;
        if (!isIrregular) {
            const headerRowIdx = findBestHeaderRow(values, 5);
            const { dateCols, firstDateCol } = findHeaderInfo(values, headerRowIdx);
            dateCols.forEach(({ col, date }) => dateColMap.set(col, isoDate(date)));
            const headerRow = values[headerRowIdx];
            idKeyCol = findLabeledCol(headerRow, firstDateCol, /사번/);
            idNameCol = findLabeledCol(headerRow, firstDateCol, /이름|근무자/);
        }

        const wrap = document.createElement('div');
        wrap.className = 'table-scroll';
        const table = document.createElement('table');
        table.className = 'sheet-table';
        const colOffsets = cumulativeOffsets(payload.columnWidths, COL_WIDTH);
        const rowOffsets = cumulativeOffsets(payload.rowHeights, ROW_HEIGHT);
        addColumnWidths(table, payload.columnWidths);

        const fragment = document.createDocumentFragment();
        values.forEach((row, r) => {
            const tr = document.createElement('tr');
            if (payload.rowHeights && payload.rowHeights[r]) tr.style.height = `${payload.rowHeights[r]}px`;
            if (r >= freezeRows && !isIrregular) {
                const key = idKeyCol >= 0 ? (row[idKeyCol] || '').trim() : '';
                const name = idNameCol >= 0 ? (row[idNameCol] || '').trim() : '';
                if (key || name) { tr.dataset.personKey = key || name; tr.dataset.personName = name || key; }
            }
            row.forEach((cellVal, c) => {
                const key = `${r},${c}`;
                if (mergedAway.has(key)) return;
                const isHeaderRow = r < freezeRows;
                const isFreezeCol = c < freezeCols;
                const el = document.createElement(isHeaderRow ? 'th' : 'td');
                el.textContent = cellVal;
                el.setAttribute('style', cellStyleAttr(payload, r, c, { skipWrap: isHeaderRow || isFreezeCol }));
                const merge = mergeStart.get(key);
                if (merge) {
                    if (merge.numRows > 1) el.rowSpan = merge.numRows;
                    if (merge.numCols > 1) el.colSpan = merge.numCols;
                }
                let z = 1;
                if (isHeaderRow) { el.classList.add('freeze-row'); el.style.top = `${rowOffsets[r]}px`; z = 20; }
                if (isFreezeCol) { el.classList.add('freeze-col'); el.style.left = `${colOffsets[c]}px`; z = isHeaderRow ? 30 : 10; }
                el.style.zIndex = String(z);
                if (dateColMap.has(c)) el.dataset.date = dateColMap.get(c);
                tr.appendChild(el);
            });
            fragment.appendChild(tr);
        });

        table.appendChild(fragment);
        wrap.appendChild(table);
        container.appendChild(wrap);
    }

    function renderStackedLinear(container, payload) {
        const { values, merges } = payload;
        const { mergeStart, mergedAway } = buildMergeMap(merges);
        const blockHeaderIdxs = findBlockHeaders(values);
        const blockHeaderSet = new Set(blockHeaderIdxs);

        // 블록(월)별로 날짜열/사람열 정보를 미리 계산 (검색 이동 시 하이라이트용)
        const blockInfo = new Map();
        blockHeaderIdxs.forEach(headerRowIdx => {
            const { dateCols, firstDateCol } = findHeaderInfo(values, headerRowIdx);
            const dateColMap = new Map();
            dateCols.forEach(({ col, date }) => dateColMap.set(col, isoDate(date)));
            const headerRow = values[headerRowIdx];
            const idKeyCol = findLabeledCol(headerRow, firstDateCol, /사번/);
            const idNameCol = findLabeledCol(headerRow, firstDateCol, /이름|근무자/);
            blockInfo.set(headerRowIdx, { dateColMap, idKeyCol, idNameCol });
        });

        const wrap = document.createElement('div');
        wrap.className = 'table-scroll';
        const table = document.createElement('table');
        table.className = 'sheet-table';
        const colOffsets = cumulativeOffsets(payload.columnWidths, COL_WIDTH);
        const rowOffsets = cumulativeOffsets(payload.rowHeights, ROW_HEIGHT);
        addColumnWidths(table, payload.columnWidths);

        let blockIndex = -1;
        let currentInfo = null;
        const fragment = document.createDocumentFragment();
        values.forEach((row, r) => {
            if (blockHeaderSet.has(r)) { blockIndex++; currentInfo = blockInfo.get(r); }
            const isHeaderRow = blockHeaderSet.has(r);
            const tr = document.createElement('tr');
            if (payload.rowHeights && payload.rowHeights[r]) tr.style.height = `${payload.rowHeights[r]}px`;
            if (!isHeaderRow && currentInfo) {
                const key = currentInfo.idKeyCol >= 0 ? (row[currentInfo.idKeyCol] || '').trim() : '';
                const name = currentInfo.idNameCol >= 0 ? (row[currentInfo.idNameCol] || '').trim() : '';
                if (key || name) { tr.dataset.personKey = key || name; tr.dataset.personName = name || key; }
            }
            row.forEach((cellVal, c) => {
                const key = `${r},${c}`;
                if (mergedAway.has(key)) return;
                const isFreezeCol = c === 0;
                const el = document.createElement(isHeaderRow ? 'th' : 'td');
                el.textContent = cellVal;
                el.setAttribute('style', cellStyleAttr(payload, r, c, { skipWrap: isHeaderRow || isFreezeCol }));
                const merge = mergeStart.get(key);
                if (merge) {
                    if (merge.numRows > 1) el.rowSpan = merge.numRows;
                    if (merge.numCols > 1) el.colSpan = merge.numCols;
                }
                let z = 1;
                if (isHeaderRow) { el.classList.add('freeze-row'); el.style.top = `${rowOffsets[r] - rowOffsets[blockHeaderIdxs[blockIndex]]}px`; z = 20 + blockIndex; }
                if (isFreezeCol) { el.classList.add('freeze-col'); el.style.left = `${colOffsets[c]}px`; z = isHeaderRow ? 100 + blockIndex : 10; }
                el.style.zIndex = String(z);
                if (currentInfo && currentInfo.dateColMap.has(c)) el.dataset.date = currentInfo.dateColMap.get(c);
                tr.appendChild(el);
            });
            fragment.appendChild(tr);
        });

        table.appendChild(fragment);
        wrap.appendChild(table);
        container.appendChild(wrap);
    }

    function renderCalendarGrid(container, payload) {
        const { values, merges } = payload;
        const blocks = findCalendarBlocks(values, merges);
        const wrap = document.createElement('div');
        wrap.className = 'calendar-blocks';

        blocks.forEach(block => {
            const { dowRow, dateRow } = findBlockHeaderRows(values, block);
            if (dowRow === -1) return;
            const lastHeaderRow = dateRow !== -1 ? dateRow : dowRow;

            // 요일열별 날짜 매핑 (검색 이동 시 이름 셀 하이라이트용)
            const dayColsMap = new Map();
            if (dateRow !== -1) {
                for (let c = block.startCol; c < block.startCol + block.width; c++) {
                    const dow = (values[dowRow][c] || '').trim();
                    const dateTok = (values[dateRow][c] || '').trim();
                    const m = dateTok.match(/^(\d{1,2})월(\d{1,2})일$/);
                    if (/^(월|화|수|목|금|토|일)$/.test(dow) && m) {
                        dayColsMap.set(c, isoDate(new Date(new Date().getFullYear(), +m[1] - 1, +m[2])));
                    }
                }
            }

            const blockWrap = document.createElement('div');
            blockWrap.className = 'calendar-block';
            const title = document.createElement('div');
            title.className = 'calendar-block-title';
            title.textContent = block.title;
            blockWrap.appendChild(title);

            const scroll = document.createElement('div');
            scroll.className = 'table-scroll';
            const table = document.createElement('table');
            table.className = 'sheet-table';

            const appendRow = (r, isHeader) => {
                const tr = document.createElement('tr');
                for (let c = block.startCol; c < block.startCol + block.width; c++) {
                    const isFreezeCol = c === block.startCol;
                    const el = document.createElement(isHeader ? 'th' : 'td');
                    el.textContent = values[r][c] || '';
                    el.setAttribute('style', cellStyleAttr(payload, r, c, { skipWrap: isHeader || isFreezeCol }));
                    let z = 1;
                    if (isHeader) { el.classList.add('freeze-row'); el.style.top = `${(r - dowRow) * ROW_HEIGHT}px`; z = 20; }
                    if (isFreezeCol) { el.classList.add('freeze-col'); el.style.left = '0px'; z = isHeader ? 30 : 10; }
                    el.style.zIndex = String(z);
                    if (!isHeader && !isFreezeCol) {
                        if (dayColsMap.has(c)) el.dataset.date = dayColsMap.get(c);
                        const personVal = (values[r][c] || '').trim();
                        if (personVal) el.dataset.person = personVal;
                    }
                    tr.appendChild(el);
                }
                table.appendChild(tr);
            };

            for (let r = dowRow; r <= lastHeaderRow; r++) appendRow(r, true);
            for (let r = lastHeaderRow + 1; r < values.length; r++) {
                const slice = values[r].slice(block.startCol, block.startCol + block.width);
                if (slice.every(v => !v)) continue;
                appendRow(r, false);
            }

            scroll.appendChild(table);
            blockWrap.appendChild(scroll);
            wrap.appendChild(blockWrap);
        });

        container.appendChild(wrap);
    }

    function renderSheetTable(container, payload) {
        container.innerHTML = '';
        if (payload.error) {
            container.innerHTML = `<p class="text-red-500 text-xs p-4">시트를 불러오지 못했습니다.</p>`;
            return;
        }
        const shape = detectShape(payload);
        if (shape === 'B') renderCalendarGrid(container, payload);
        else if (shape === 'A2') renderStackedLinear(container, payload);
        else renderGenericTable(container, payload);
    }

    /* ============================== SEARCH ============================== */
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function getTodayKST() {
        const now = new Date();
        const d = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Seoul' }));
        d.setHours(0, 0, 0, 0);
        return d;
    }

    function sameDay(a, b) {
        return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function isoDate(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function updateSearchStatus() {
        const statusEl = document.getElementById('search-status');
        const ready = searchIndexReady.group1 && searchIndexReady.group2;
        statusEl.textContent = ready ? '' : '검색 준비 중...';
    }

    function renderSearchDropdown(query) {
        const dropdown = document.getElementById('search-dropdown');
        const q = query.trim();
        if (!q) { dropdown.classList.add('hidden'); dropdown.innerHTML = ''; return; }

        const matches = searchIndex.filter(r => r.personKey.includes(q) || r.personName.includes(q));
        dropdown.innerHTML = '';
        if (!matches.length) {
            const ready = searchIndexReady.group1 && searchIndexReady.group2;
            dropdown.innerHTML = `<div class="search-dropdown-empty">${ready ? `"${escapeHtml(q)}"에 대한 근무 기록을 찾을 수 없습니다.` : '검색 준비 중...'}</div>`;
            dropdown.classList.remove('hidden');
            return;
        }
        matches.slice(0, 20).forEach(record => {
            const item = document.createElement('div');
            item.className = 'search-dropdown-item';
            item.innerHTML = `<div class="n">${escapeHtml(record.personName)}<span class="k">${escapeHtml(record.personKey)}</span></div>
                <div class="m">${escapeHtml(GROUPS[record.group].name)} &middot; ${escapeHtml(record.sheetName)}</div>`;
            item.addEventListener('mousedown', (e) => {
                e.preventDefault(); // input blur보다 먼저 처리되도록
                dropdown.classList.add('hidden');
                document.getElementById('search-input').value = '';
                document.getElementById('search-clear').classList.add('hidden');
                jumpToRecord(record);
            });
            dropdown.appendChild(item);
        });
        dropdown.classList.remove('hidden');
    }

    function highlightPerson(container, record, shape) {
        if (shape === 'B') {
            const cells = Array.from(container.querySelectorAll('td[data-person]'))
                .filter(td => td.dataset.person === record.personName);
            cells.forEach(td => td.classList.add('search-highlight'));
            const todayIso = isoDate(getTodayKST());
            const todayCell = cells.find(td => td.dataset.date === todayIso);
            (todayCell || cells[0])?.scrollIntoView({ block: 'center', inline: 'center' });
            return;
        }
        const rows = Array.from(container.querySelectorAll('tr[data-person-key]')).filter(tr =>
            tr.dataset.personKey === record.personKey || tr.dataset.personName === record.personName);
        if (!rows.length) return;
        rows.forEach(tr => tr.classList.add('search-highlight'));
        const targetRow = rows[0];
        const todayIso = isoDate(getTodayKST());
        const todayCell = targetRow.querySelector(`[data-date="${todayIso}"]`);
        if (todayCell) todayCell.classList.add('search-highlight-cell');
        (todayCell || targetRow).scrollIntoView({ block: 'center', inline: 'center' });
    }

    async function jumpToRecord(record) {
        const list = await ensureGroupIndexed(record.group);

        document.querySelectorAll('.tab').forEach(b => b.dataset.active = 'false');
        document.getElementById(`btn-${record.group}`).dataset.active = 'true';
        document.getElementById('group1-sub').classList.add('hidden');
        document.getElementById('group2-sub').classList.add('hidden');
        const chipsContainer = document.getElementById(`${record.group}-sub`);
        chipsContainer.classList.remove('hidden');

        if (chipsContainer.childElementCount === 0 && list) {
            list.forEach(({ name, gid }) => {
                const btn = document.createElement('button');
                btn.textContent = name;
                btn.className = 'chip';
                btn.dataset.active = 'false';
                btn.onclick = () => loadSheet(record.group, gid, btn);
                chipsContainer.appendChild(btn);
            });
        }

        let matchBtn = null;
        for (const btn of chipsContainer.getElementsByTagName('button')) {
            if (btn.textContent === record.sheetName) { matchBtn = btn; break; }
        }
        chipsContainer.querySelectorAll('.chip').forEach(b => b.dataset.active = 'false');
        if (matchBtn) matchBtn.dataset.active = 'true';

        await loadSheet(record.group, record.gid, matchBtn);
        const payload = sheetCache.get(`${record.group}:${record.gid}`);
        highlightPerson(document.getElementById('sheet-container'), record, detectShape(payload));
    }

    /* ============================== UI WIRING ============================== */
    async function loadSheet(group, gid, btnEl) {
        document.querySelectorAll('.chip').forEach(b => { b.dataset.active = 'false'; });
        if (btnEl) btnEl.dataset.active = 'true';
        currentGroup = group; currentGid = gid;
        const sequence = ++loadSequence;

        const loadingOverlay = document.getElementById('loading-overlay');
        loadingOverlay.classList.remove('hidden');
        try {
            const payload = await fetchSingleSheet(group, gid);
            if (sequence !== loadSequence) return;
            renderSheetTable(document.getElementById('sheet-container'), payload);
        } catch (err) {
            document.getElementById('sheet-container').innerHTML = '<p class="text-red-500 text-xs p-4">시트를 불러오지 못했습니다.</p>';
            console.error(err);
        } finally {
            if (sequence === loadSequence) loadingOverlay.classList.add('hidden');
        }
    }

    function toggleGroup(groupKey, buttonEl) {
        document.getElementById('group1-sub').classList.add('hidden');
        document.getElementById('group2-sub').classList.add('hidden');

        const container = document.getElementById(`${groupKey}-sub`);
        container.classList.remove('hidden');

        document.querySelectorAll('.tab').forEach(btn => btn.dataset.active = 'false');
        buttonEl.dataset.active = 'true';

        if (container.childElementCount > 0) return;

        const loadingOverlay = document.getElementById('loading-overlay');
        loadingOverlay.classList.remove('hidden');

        fetchSheetList(groupKey)
            .then(sheets => {
                container.innerHTML = '';
                sheets.forEach(({ name, gid }, index) => {
                    const btn = document.createElement('button');
                    btn.textContent = name;
                    btn.className = 'chip';
                    btn.dataset.active = 'false';
                    btn.onclick = () => loadSheet(groupKey, gid, btn);
                    container.appendChild(btn);
                    if (groupKey === 'group1' && index === 0) btn.click();
                });
            })
            .catch(err => {
                container.innerHTML = "<p class='text-red-500 text-xs font-medium'>데이터를 불러오지 못했습니다.</p>";
                console.error(err);
            })
            .finally(() => {
                loadingOverlay.classList.add('hidden');
            });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const groupKey = urlParams.get('group');
        const sheetName = urlParams.get('sheet');

        if (!(groupKey && sheetName)) {
            document.getElementById('btn-group1')?.click();
        } else {
            const targetGroupBtn = document.getElementById(`btn-${groupKey}`);
            if (targetGroupBtn) targetGroupBtn.click();

            if (GROUPS[groupKey]) {
                fetchSheetList(groupKey)
                    .then(sheets => {
                        const match = sheets.find(s => s.name === sheetName);
                        if (!match) return;
                        loadSheet(groupKey, match.gid);
                        setTimeout(() => {
                            const subContainer = document.getElementById(`${groupKey}-sub`);
                            for (const btn of subContainer.getElementsByTagName('button')) {
                                if (btn.textContent === sheetName) {
                                    document.querySelectorAll('.chip').forEach(b => b.dataset.active = 'false');
                                    btn.dataset.active = 'true';
                                    break;
                                }
                            }
                        }, 1000);
                    });
            }
        }

        updateSearchStatus();

        const searchInput = document.getElementById('search-input');
        const searchDropdown = document.getElementById('search-dropdown');
        let debounceTimer = null;
        searchInput.addEventListener('input', () => {
            document.getElementById('search-clear').classList.toggle('hidden', !searchInput.value.trim());
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => renderSearchDropdown(searchInput.value), 150);
        });
        searchInput.addEventListener('focus', () => {
            ensureGroupIndexed('group1');
            ensureGroupIndexed('group2');
            if (searchInput.value.trim()) renderSearchDropdown(searchInput.value);
        });
        searchInput.addEventListener('blur', () => {
            setTimeout(() => searchDropdown.classList.add('hidden'), 100);
        });

        document.getElementById('search-clear').addEventListener('click', () => {
            searchInput.value = '';
            searchInput.focus();
            document.getElementById('search-clear').classList.add('hidden');
            searchDropdown.classList.add('hidden');
            searchDropdown.innerHTML = '';
        });

    });
    </script>
